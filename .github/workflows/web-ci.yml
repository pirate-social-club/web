name: web-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.shard }}/4)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and component tests
        run: >-
          bun test
          --shard=${{ matrix.shard }}/4
          --max-concurrency=4
          --timeout=15000
          --reporter=junit
          --reporter-outfile=test-results/web-unit-${{ matrix.shard }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: web-unit-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/web-unit-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 7
