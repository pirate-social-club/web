pre_plan:
  - action: http_get
    items:
      - url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.10/bun-linux-x64-baseline.zip
        filename: bun-runtime.zip
plan:
  - action: shell
    shell: |
      set -euo pipefail
      grep -q 'source-only' /ci/src/.radicle/ambient.yaml
      runtime_dir=/ci/cache/bun-runtime
      bun_runtime="$runtime_dir/bun"
      if [[ ! -x "$bun_runtime" ]]; then
        runtime_sha256=41201a8c5ee74a9dcbb1ce25a1104f1f929838b57a845aa78d98379b0ce7cde2
        echo "$runtime_sha256  /ci/deps/bun-runtime.zip" | sha256sum -c -
        temp=$(mktemp -d "$runtime_dir.tmp.XXXXXX")
        unzip -q /ci/deps/bun-runtime.zip -d "$temp"
        install -d "$runtime_dir"
        install -m 0755 "$temp/bun-linux-x64-baseline/bun" "$bun_runtime"
        rm -rf -- "$temp"
      fi
      bun_bin_dir=$(dirname "$bun_runtime")
      export PATH="$bun_bin_dir:$PATH"
      cd /ci/src/packages/karaoke-runtime

      # This package has no runtime dependencies. Keep the authoritative gate
      # hermetic and source-focused; hosted CI retains native typechecking.
      "$bun_runtime" run scripts/build-provenance.ts
      echo '==> test (source-only)'
      timeout --foreground 15m "$bun_runtime" test \
        tests/binary-codec.test.ts \
        tests/build-provenance.test.ts \
        tests/commit-scheduler.test.ts \
        tests/exports.test.ts \
        tests/reducer-watermark.test.ts \
        tests/scoring-normalization.test.ts \
        tests/scoring-offset.test.ts \
        tests/scoring-phonetic-stream.test.ts \
        tests/scoring-summary.test.ts \
        tests/scoring-timing-alignment.test.ts \
        tests/serialization.test.ts \
        tests/transport.test.ts
      echo '<== test (source-only)'
      echo '==> lint:imports (source-only)'
      timeout --foreground 5m "$bun_runtime" run lint:imports
      echo '<== lint:imports (source-only)'
