name: web-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Required application-source gate. Test and Storybook projects have separate
  # tsconfigs and are not covered by this job.
  typecheck:
    name: typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Read pinned API commit
        id: api-pin
        shell: bash
        # Web ships with this exact API contract. Using API main here would let
        # web compile against contract changes that production does not serve yet.
        run: echo "sha=$(tr -d '[:space:]' < .github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api
          ref: ${{ steps.api-pin.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run types

      - name: Audit dead code
        run: bun run deadcode:audit

      - name: Audit dependency declarations
        run: bun run deps:audit

      - name: Lint React hooks
        run: bun run lint:hooks

  unit-tests:
    name: unit-tests (${{ matrix.shard }}/4)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Check out API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Generate karaoke runtime build provenance
        working-directory: web/packages/karaoke-runtime
        run: bun run build:provenance

      - name: Run unit and component tests
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: 4
        run: |
          set -uo pipefail

          # `scripts` is included deliberately: scripts/ci/dependency-audit.test.ts
          # existed for weeks without ever running, because discovery stopped at
          # src and packages. A test that never runs is worse than no test — it
          # reads as coverage.
          mapfile -t test_files < <(
            find src packages scripts -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              -print | sort
          )

          failures=0
          selected=0
          for index in "${!test_files[@]}"; do
            if (( index % TEST_SHARD_COUNT != TEST_SHARD - 1 )); then
              continue
            fi

            test_file="${test_files[$index]}"
            selected=$((selected + 1))
            echo "::group::${test_file}"
            if ! bun test "${test_file}" --timeout=15000; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          echo "Shard ${TEST_SHARD}/${TEST_SHARD_COUNT}: ${selected} files, ${failures} failed"
          if (( failures > 0 )); then
            exit 1
          fi

  generic-goods-storybook:
    name: generic goods Storybook (${{ matrix.flow }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        flow:
          - components/compositions/posts/post-composer/stories/file
          - components/compositions/posts/post-composer/stories/deck
          - components/compositions/digital-goods/stories
          - components/compositions/learning-decks/stories

    steps:
      - name: Check out Web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Read pinned API commit
        id: api-pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < .github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api
          ref: ${{ steps.api-pin.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Verify required flow interaction contracts
        run: bun test scripts/storybook-required-flows.test.ts

      - name: Build focused Storybook cold and warm
        env:
          STORYBOOK_ONLY: ${{ matrix.flow }}
        shell: bash
        run: |
          set -euo pipefail
          # The release gate requires three consecutive cold/warm trials. Keep
          # each cold run genuinely cold while the following warm run reuses
          # the seeded manager cache from that pair.
          for trial in 1 2 3; do
            rm -rf storybook-static
            /usr/bin/time -f '%M %e' -o /tmp/storybook-cold-rss bun run build-storybook
            read -r cold_kb cold_seconds < /tmp/storybook-cold-rss
            rm -rf storybook-static
            /usr/bin/time -f '%M %e' -o /tmp/storybook-warm-rss bun run build-storybook
            read -r warm_kb warm_seconds < /tmp/storybook-warm-rss
            echo "focused=${STORYBOOK_ONLY} trial=${trial} cold_rss_kb=${cold_kb} cold_seconds=${cold_seconds} warm_rss_kb=${warm_kb} warm_seconds=${warm_seconds}"
            # Focused discovery must stay below the workstation-safe envelope.
            if (( cold_kb > 2500000 || warm_kb > 2500000 )); then
              echo "focused Storybook RSS exceeded 2.5 GiB"
              exit 1
            fi
          done

      - name: Serve focused Storybook
        shell: bash
        run: |
          python3 -m http.server 6006 --directory storybook-static >/tmp/storybook-server.log 2>&1 &
          echo $! > /tmp/storybook-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:6006/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/storybook-server.log
          exit 1

      - name: Install Chromium for focused interactions
        run: bunx playwright install chromium

      - name: Run focused Storybook interactions
        run: bun run test-storybook --index-json --url http://127.0.0.1:6006 --includeTags digital-goods --browsers chromium --maxWorkers=2 --testTimeout=30000 --no-cache --junit --ci

      - name: Upload focused Storybook artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-goods-storybook-${{ matrix.flow }}
          path: |
            web/storybook-static
            web/junit.xml
            /tmp/storybook-server.log
          if-no-files-found: warn
          retention-days: 7

  promotion-shadow-store:
    name: promotion-shadow-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Check out canonical promotion schema
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: 508477aeed2157f4f6c9dbc34c6ddf1ad189169f
          path: core

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Run promotion shadow store integration test
        working-directory: web
        env:
          PROMOTION_STORE_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
          PROMOTION_STORE_TEST_CORE_DIR: ${{ github.workspace }}/core
        run: bun test scripts/ci/promotion-model/postgres-store.test.ts
