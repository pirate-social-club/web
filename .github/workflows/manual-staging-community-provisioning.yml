name: Manual staging community provisioning

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ALLOCATE_ONE_STAGING_D1 to consume one staging pool binding
        required: true
        type: string
      allocation_budget:
        description: Permanent allocations allowed (1 normally; 0 only when resuming)
        required: true
        default: 1
        type: number
      resume_community_id:
        description: Existing fixture id from a partial run; requires resume confirmation and budget 0
        required: false
        type: string
      resume_run_id:
        description: Original run id from the partial-run artifact
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-staging-community-provisioning
  cancel-in-progress: false

jobs:
  provision:
    name: Allocate and verify one staging community
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    # Do not attach a GitHub Environment here. Infisical's OIDC auth method is
    # intentionally bound to repo:pirate-social-club/web:ref:refs/heads/main;
    # an environment would replace that subject and make secret auth fail.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Read reviewed dependency pins
        id: refs
        working-directory: web
        shell: bash
        run: |
          echo "api_sha=$(tr -d '[:space:]' < .github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"
          echo "core_sha=$(tr -d '[:space:]' < .github/release-refs/core.sha)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ steps.refs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ steps.refs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Fetch staging authentication secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Allocate and verify one community
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          PIRATE_PROVISIONING_ALLOCATION_BUDGET: ${{ inputs.allocation_budget }}
          PIRATE_PROVISIONING_ARTIFACT_PATH: tmp/e2e-artifacts/manual-staging-provisioning.json
          PIRATE_PROVISIONING_CONFIRM: ${{ inputs.confirmation }}
          PIRATE_PROVISIONING_RESUME_COMMUNITY_ID: ${{ inputs.resume_community_id }}
          PIRATE_PROVISIONING_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
        run: bun run scripts/manual-staging-community-provisioning.ts
      - name: Upload provisioning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manual-staging-provisioning-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tmp/e2e-artifacts/manual-staging-provisioning.json
          if-no-files-found: warn
          retention-days: 30
