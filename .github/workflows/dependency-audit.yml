name: Dependency audit

# The audit that used to sit on the release critical path. Advisory publication is
# a time-varying input we do not control, so a newly published high advisory would
# turn every release red until someone hand-patched an --ignore — with no
# dependency change involved. That signal is worth having; blocking unrelated
# deploys on somebody else's publication schedule is not.
#
# Releases still fail on an unaccepted CRITICAL (see release.yml). Everything at
# high runs here and lands in a tracked issue instead.
on:
  schedule:
    # 06:15 UTC daily. Off-hours so a newly published advisory is triaged before
    # the working day rather than discovered mid-release.
    - cron: "15 6 * * *"
  pull_request:
    # Dependency changes are the one case where an audit result is genuinely
    # attributable to the change under review, so gate those on the PR.
    paths:
      - "**/package.json"
      - "**/bun.lock"
      - "**/bun.lockb"
      - "**/package-lock.json"
      - .github/dependency-audit-baseline.json
      - .github/workflows/dependency-audit.yml
      - scripts/ci/dependency-audit.mjs
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Advisory audit (high and above)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: main
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: main
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      # Fails on an unaccepted high/critical, and on a baseline exception whose
      # expiry has lapsed. Failing HERE is the point: it forces review on a real
      # deadline without blocking whoever happens to merge next.
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        working-directory: web
        run: |
          node scripts/ci/dependency-audit.mjs \
            --mode scheduled \
            --baseline .github/dependency-audit-baseline.json \
            --target .:bun \
            --target ../api/services/shared:bun \
            --target ../api/services/api:bun \
            --target ../core:npm
      - name: Open or update the tracked advisory issue
        if: steps.audit.outcome == 'failure' && github.event_name != 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          AUDIT_REPORT: ${{ steps.audit.outputs.report }}
        with:
          script: |
            const title = "Dependency advisories need review";
            const report = (process.env.AUDIT_REPORT || "").replace(/%0A/gu, "\n").replace(/%0D/gu, "\r").replace(/%25/gu, "%");
            const body = [
              "The scheduled dependency audit found advisories at **high or above** that are not",
              "covered by an unexpired entry in `.github/dependency-audit-baseline.json`,",
              "or found a baseline exception whose expiry has lapsed.",
              "",
              "Releases are NOT blocked by this: release runs fail only on an unaccepted",
              "**critical**. Fix the dependency, or add a reviewed baseline exception with a",
              "reason and an expiry — an exception is a security decision, not a build fix.",
              "",
              "```",
              report || "(no report captured)",
              "```",
              "",
              `Last run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join("\n");

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "dependency-audit",
              per_page: 20,
            });
            const match = existing.data.find((issue) => issue.title === title);
            if (match) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: match.number,
                body,
              });
              core.notice(`Updated tracked advisory issue #${match.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["dependency-audit"],
              });
              core.notice(`Opened tracked advisory issue #${created.data.number}`);
            }
      # The job's own status still reflects reality. On a PR that changed a
      # manifest or lockfile this is the attributable signal, so let it fail.
      - name: Reflect audit result
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::Dependency audit found unaccepted advisories or an expired baseline exception."
          exit 1
