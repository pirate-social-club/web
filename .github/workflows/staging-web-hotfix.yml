name: Staging Web Hotfix

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy staging web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Build staging web bundle
        working-directory: web
        env:
          VITE_BASE_NETWORK: base-sepolia
          VITE_EFP_ENVIRONMENT: testnet
          VITE_PIRATE_APP_ENV: staging
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
        run: bun run build:staging
      - name: Deploy staging web worker
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          WEB_SHA="$(git rev-parse --short HEAD)"
          WEB_REF="$(git rev-parse --abbrev-ref HEAD)"
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ./node_modules/.bin/wrangler deploy dist/worker/index.js \
            --config wrangler.jsonc \
            --env staging \
            --assets dist/client \
            --no-bundle \
            --var "DEPLOY_ENV:staging" \
            --var "BUILD_GIT_SHA:$WEB_SHA" \
            --var "BUILD_GIT_REF:$WEB_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
          ./node_modules/.bin/wrangler deploy \
            --config wrangler.public.jsonc \
            --env staging \
            --var "DEPLOY_ENV:staging" \
            --var "BUILD_GIT_SHA:$WEB_SHA" \
            --var "BUILD_GIT_REF:$WEB_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
      - name: Verify staging web metadata
        working-directory: web
        run: |
          WEB_SHA="$(git rev-parse --short HEAD)"
          scripts/check-deployments.sh --scope staging --expected-web-sha "$WEB_SHA" --retry-for 60 --no-strict
