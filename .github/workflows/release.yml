name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VITE_PRIVY_APP_ID: ${{ secrets.VITE_PRIVY_APP_ID || vars.VITE_PRIVY_APP_ID }}
  VITE_PRIVY_CLIENT_ID: ${{ secrets.VITE_PRIVY_CLIENT_ID || vars.VITE_PRIVY_CLIENT_ID }}
  VITE_PIRATE_APP_ENV: ${{ vars.VITE_PIRATE_APP_ENV || 'prod' }}
  VITE_BASE_NETWORK: ${{ vars.VITE_BASE_NETWORK }}
  VITE_EFP_ENVIRONMENT: ${{ vars.VITE_EFP_ENVIRONMENT }}

jobs:
  staging:
    name: Deploy staging
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/core
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      - name: Deploy staging
        working-directory: web
        run: scripts/deploy-staging.sh
      - name: Verify staging/prod metadata
        working-directory: web
        run: scripts/check-deployments.sh --no-strict
      - name: Smoke staging
        working-directory: web
        run: scripts/smoke-test.sh staging
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke staging
        working-directory: web
        env:
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_API_BASE_URL: https://api-staging.pirate.sc
        run: bun run test:e2e
      - name: Live browser integration staging
        working-directory: web
        continue-on-error: true
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ secrets.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ secrets.AUTH_UPSTREAM_JWT_ISSUER }}
          AUTH_UPSTREAM_JWT_SHARED_SECRET: ${{ secrets.AUTH_UPSTREAM_JWT_SHARED_SECRET }}
        run: bun run test:e2e:live-staging
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
      - name: Apply staging community migrations
        working-directory: core
        env:
          CONTROL_PLANE_DATABASE_URL: ${{ secrets.STAGING_CONTROL_PLANE_DATABASE_URL }}
          TURSO_COMMUNITY_DB_WRAP_KEY: ${{ secrets.STAGING_TURSO_COMMUNITY_DB_WRAP_KEY }}
        run: |
          test -n "$CONTROL_PLANE_DATABASE_URL"
          test -n "$TURSO_COMMUNITY_DB_WRAP_KEY"
          bun scripts/community/apply-remote-community-migrations.ts --execute

  production:
    name: Deploy production
    needs: staging
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Deploy production
        working-directory: web
        run: scripts/deploy-production.sh --confirm-production --skip-tests
