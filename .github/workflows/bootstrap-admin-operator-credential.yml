name: Bootstrap admin operator credential

on:
  workflow_dispatch:

concurrency:
  group: bootstrap-admin-operator-credential
  cancel-in-progress: false

jobs:
  bootstrap-production:
    name: Issue and store production credential
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Read release pins
        id: refs
        working-directory: web
        shell: bash
        run: |
          api_sha="$(< .github/release-refs/api.sha)"
          core_sha="$(< .github/release-refs/core.sha)"
          [[ "$api_sha" =~ ^[0-9a-f]{40}$ && "$core_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "api_sha=$api_sha" >> "$GITHUB_OUTPUT"
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: 756aa74668c0766221efb76d443774e4a24f68be
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ steps.refs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Fetch production control-plane migration secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Issue and store scoped credential
        working-directory: web
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/api
          CREDENTIAL_ENV_NAME: PIRATE_ADMIN_OPERATOR_CREDENTIAL
          PIRATE_ADMIN_TOKEN: ${{ secrets.PIRATE_ADMIN_TOKEN }}
          REVOKE_CREDENTIAL_IDS: opc_cb7557e9008be494c085d7f23f2a0b35 opc_4e1589f8092fb7fee4dea5a2e0fccb57
        run: scripts/ci/bootstrap-admin-operator-credential.sh "$GITHUB_WORKSPACE/api"

  bootstrap-staging:
    name: Bind staging credential
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Read release Core pin
        id: refs
        working-directory: web
        shell: bash
        run: |
          core_sha="$(< .github/release-refs/core.sha)"
          [[ "$core_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: 756aa74668c0766221efb76d443774e4a24f68be
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ steps.refs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Fetch staging control-plane migration secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: a7b5d0b2-0891-4b63-b0e6-946a8c513458
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Bind staging operator credential
        working-directory: web
        env:
          CREDENTIAL_ENV_NAME: PIRATE_ADMIN_OPERATOR_CREDENTIAL
          PIRATE_ADMIN_TOKEN: ${{ secrets.PIRATE_ADMIN_TOKEN }}
          REVOKE_CREDENTIAL_IDS: opc_cb7557e9008be494c085d7f23f2a0b35 opc_4e1589f8092fb7fee4dea5a2e0fccb57
        run: |
          credential="opc_admin_automation.${PIRATE_ADMIN_TOKEN}"
          echo "::add-mask::$credential"
          export PIRATE_ADMIN_OPERATOR_CREDENTIAL="$credential"
          scripts/ci/bootstrap-admin-operator-credential.sh "$GITHUB_WORKSPACE/api"
