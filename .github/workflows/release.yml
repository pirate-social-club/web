name: Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  staging-api-only:
    name: Deploy staging API only
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          path: api
          ref: codex/staging-video-uses-song-api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Build API worker
        working-directory: api/services/api
        run: bun build src/index.ts --target=bun --outfile=/tmp/pirate-api-worker.js
      - name: Deploy staging API worker
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          API_SHA="$(git rev-parse --short HEAD)"
          API_REF="$(git rev-parse --abbrev-ref HEAD)"
          ./node_modules/.bin/wrangler deploy \
            --env staging \
            --var "BUILD_GIT_SHA:$API_SHA-video-uses-song-e2e" \
            --var "BUILD_GIT_REF:$API_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP" \
            --define "__PIRATE_BUILD_GIT_SHA__:\"$API_SHA-video-uses-song-e2e\"" \
            --define "__PIRATE_BUILD_GIT_REF__:\"$API_REF\"" \
            --define "__PIRATE_BUILD_TIMESTAMP__:\"$BUILD_TIMESTAMP\""
      - name: Verify staging API metadata
        run: |
          expected="$(cd api && git rev-parse --short HEAD)-video-uses-song-e2e"
          for i in $(seq 1 30); do
            body="$(curl -fsS https://api-staging.pirate.sc/__version)"
            echo "$body"
            echo "$body" | grep -F "\"git_sha\":\"$expected\"" && exit 0
            sleep 2
          done
          echo "staging API did not report expected git_sha suffix: $expected" >&2
          exit 1
