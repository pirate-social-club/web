name: Release canaries

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  # A new main push is a cancellation signal only: all jobs below require a
  # workflow_run event. It stops an older canary before the new release changes
  # staging underneath it.
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release-canaries.yml

# Canary serialization is deliberately independent from the release workflow.
# A newer completed release supersedes an older observational run, but can never
# cancel migrations or a production deploy.
concurrency:
  group: release-canaries-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  canary-inputs:
    name: Verify canary target
    if: >-
      github.event_name == 'workflow_run'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
      && github.event.workflow_run.conclusion == 'success'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      api_sha: ${{ steps.refs.outputs.api_sha }}
      core_sha: ${{ steps.refs.outputs.core_sha }}
      run_canaries: ${{ steps.current.outputs.run_canaries }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: web
      - name: Read pinned release commits
        id: refs
        working-directory: web
        shell: bash
        run: |
          api_sha="$(< .github/release-refs/api.sha)"
          core_sha="$(< .github/release-refs/core.sha)"
          if [[ ! "$api_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/api.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          if [[ ! "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/core.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "api_sha=$api_sha" >> "$GITHUB_OUTPUT"
          echo "core_sha=$core_sha" >> "$GITHUB_OUTPUT"
      - name: Require the completed release to remain current
        id: current
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const releaseSha = process.env.RELEASE_SHA;
            const current = ref.object.sha === releaseSha;
            core.setOutput("run_canaries", current ? "true" : "false");
            if (current) {
              core.notice(`Release ${releaseSha} is still the current main tip.`);
            } else {
              core.notice(
                `Skipping stale canaries: release ${releaseSha}, current main ${ref.object.sha}.`
              );
            }
      - name: Require the released Web/API pair on staging
        if: steps.current.outputs.run_canaries == 'true'
        working-directory: web
        env:
          API_SHA: ${{ steps.refs.outputs.api_sha }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          scripts/check-deployments.sh \
            --scope staging \
            --expected-web-sha "$RELEASE_SHA" \
            --expected-api-sha "$API_SHA" \
            --retry-for 120

  # Story/Aeneid is an external observational signal. It runs only after a
  # successful release and cannot hold the release concurrency group.
  commerce-gate:
    name: Story commerce canary (non-blocking)
    needs: canary-inputs
    if: needs.canary-inputs.outputs.run_canaries == 'true'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    outputs:
      story: ${{ steps.story.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.canary-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.canary-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Fetch Story commerce staging secrets
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET PIRATE_CHECKOUT_SMOKE_BUYER_PRIVATE_KEY PIRATE_CHECKOUT_RPC_URL PIRATE_CHECKOUT_USDC_TOKEN_ADDRESS STORY_RUNTIME_FUNDER_PRIVATE_KEY
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Fetch Story commerce control-plane secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: a7b5d0b2-0891-4b63-b0e6-946a8c513458
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Story derivative royalty E2E staging
        id: story
        continue-on-error: true
        timeout-minutes: 30
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          PIRATE_STORY_E2E_ARTIFACT_DIR: tmp/e2e-artifacts
          PIRATE_STORY_E2E_PREVIEW_TIMEOUT_MS: "420000"
        run: bun run test:e2e:story-derivative-royalty
      - name: Upload Story commerce artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: story-derivative-royalty-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tmp/e2e-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14

  canaries:
    name: Live browser canary (non-blocking)
    needs: canary-inputs
    if: needs.canary-inputs.outputs.run_canaries == 'true'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      live_browser: ${{ steps.live_browser.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.canary-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.canary-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install chromium
      - name: Fetch canary staging secrets
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET PIRATE_CHECKOUT_SMOKE_BUYER_PRIVATE_KEY PIRATE_CHECKOUT_RPC_URL PIRATE_CHECKOUT_USDC_TOKEN_ADDRESS STORY_RUNTIME_FUNDER_PRIVATE_KEY
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Live browser journey canary
        id: live_browser
        continue-on-error: true
        timeout-minutes: 30
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
        run: bun run test:e2e:live-staging
      - name: Upload canary Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize canary results
        if: always()
        shell: bash
        env:
          LIVE_BROWSER_OUTCOME: ${{ steps.live_browser.outcome }}
        run: |
          {
            echo "### Live canaries"
            echo ""
            echo "| Canary | Outcome |"
            echo "| --- | --- |"
            echo "| Live browser journeys | ${LIVE_BROWSER_OUTCOME} |"
            echo ""
            echo "Canaries run after release completion and never hold the release concurrency group."
          } >> "$GITHUB_STEP_SUMMARY"

  # Fail closed for observability: setup/plumbing failures still open the same
  # durable tracking issue even though this workflow cannot block a release.
  canary-alert:
    name: Report canary failures
    needs: [canary-inputs, canaries, commerce-gate]
    if: >-
      always() && github.event_name == 'workflow_run'
      && needs.canary-inputs.result != 'skipped'
      && (needs.canary-inputs.result != 'success'
        || needs.canary-inputs.outputs.run_canaries == 'true')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the canary tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          CANARY_INPUTS_JOB: ${{ needs.canary-inputs.result }}
          LIVE_BROWSER_OUTCOME: ${{ needs.canaries.outputs.live_browser }}
          STORY_OUTCOME: ${{ needs['commerce-gate'].outputs.story }}
          LIVE_BROWSER_JOB: ${{ needs.canaries.result }}
          STORY_JOB: ${{ needs['commerce-gate'].result }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const label = "canary-failure";
            const setupFailed = process.env.CANARY_INPUTS_JOB !== "success";
            const canaries = [
              {
                name: "Story commerce settlement",
                outcome: process.env.STORY_OUTCOME || "",
                job: process.env.STORY_JOB || "",
              },
              {
                name: "Live browser journeys",
                outcome: process.env.LIVE_BROWSER_OUTCOME || "",
                job: process.env.LIVE_BROWSER_JOB || "",
              },
            ];
            const ran = (canary) => canary.outcome && canary.outcome !== "skipped";
            const executed = setupFailed ? [] : canaries.filter(ran);
            const failed = setupFailed
              ? [
                  "Canary target verification: **did not complete** — staging SHA verification " +
                    `or release-input plumbing failed (${process.env.CANARY_INPUTS_JOB || "unknown"}).`,
                ]
              : canaries
                  .filter((canary) => !ran(canary) || canary.outcome !== "success")
                  .map((canary) =>
                    ran(canary)
                      ? `${canary.name}: **${canary.outcome}**`
                      : `${canary.name}: **did not run** — the canary job failed before the test started ` +
                        `(setup/plumbing, job result: \`${canary.job || "unknown"}\`). ` +
                        "The canary is blind, not passing."
                  );

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            const existing = open[0];
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const releaseUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/` +
              process.env.RELEASE_RUN_ID;
            const releaseSha = process.env.RELEASE_SHA;

            if (failed.length === 0) {
              if (existing && executed.length === canaries.length) {
                core.notice("All canaries ran and passed; closing the tracking issue.");
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All canaries passed for release \`${releaseSha}\` (${runUrl}). Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }

            const body = [
              `Canary failure for release \`${releaseSha}\`.`,
              "",
              ...failed.map((line) => `- ${line}`),
              "",
              `Canary run: ${runUrl}`,
              `Release run: ${releaseUrl}`,
              "",
              "Canaries run after release completion and never block or serialize production. " +
                "Investigate from the uploaded artifacts, not by pushing to main.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Release canary failing",
              labels: [label],
              body,
            });
