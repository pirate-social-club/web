name: repo-hygiene

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repo-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  hygiene:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Start iron-proxy egress audit
        uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a
        with:
          egress-rules: egress-rules.yaml
          warn: false

      - name: Check generated locales freshness
        run: |
          cp src/locales/generated.ts src/locales/generated.ts.bak
          node scripts/generate-locales.mjs
          if ! diff -q src/locales/generated.ts src/locales/generated.ts.bak > /dev/null 2>&1; then
            echo "::error::src/locales/generated.ts is stale. Run 'bun run locales:generate' and commit the result."
            exit 1
          fi
          echo "generated.ts is fresh"

      - name: Run UI hygiene checks
        run: node scripts/ui-audit.mjs

      - name: Show iron-proxy egress summary
        uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a
        if: always()
