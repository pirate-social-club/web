name: Staging D1 pool refill

on:
  workflow_dispatch:
    inputs:
      api_ref:
        description: API branch or commit containing the allocator
        required: true
        default: main
        type: string
      start_index:
        description: First unused DB_CMTY index
        required: true
        type: number
      count:
        description: Number of staging pool databases to create
        required: true
        default: 20
        type: number

permissions:
  contents: read

jobs:
  create:
    name: Create staging D1 pool databases
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ inputs.api_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install shard dependencies
        working-directory: services/community-d1-shard
        run: bun install --frozen-lockfile
      - name: Create staging pool databases
        working-directory: services/community-d1-shard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          bun run scripts/allocate-d1-pool.ts \
            --start '${{ inputs.start_index }}' \
            --count '${{ inputs.count }}' \
            --env-suffix staging \
            --apply | tee allocation-output.txt
          test "$(grep -c '"binding": "DB_CMTY_' allocation-output.txt)" -eq '${{ inputs.count }}'
      - name: Capture current D1 inventory
        working-directory: services/community-d1-shard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler d1 list --json > d1-list.json
      - name: Upload generated binding entries
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-d1-pool-allocation-${{ github.run_id }}
          path: |
            services/community-d1-shard/allocation-output.txt
            services/community-d1-shard/d1-list.json
          if-no-files-found: error
          retention-days: 7
