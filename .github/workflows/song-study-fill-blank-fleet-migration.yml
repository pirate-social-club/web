name: Song Study fill-blank fleet migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: Fleet and rollout scope
        required: true
        type: choice
        options:
          - staging-audit
          - staging-canary
          - staging-fleet
          - production-audit
          - production-canary
          - production-fleet
      database_name:
        description: Exact D1 database name for a canary target
        required: false
        type: string
      audit_run_id:
        description: Full-fleet audit run used to select the canary
        required: false
        type: string
      confirmation:
        description: Type AUDIT/APPLY 1156 TO STAGING/PRODUCTION as appropriate
        required: true
        type: string
      concurrency:
        description: Fleet worker concurrency
        required: true
        default: "8"
        type: choice
        options:
          - "4"
          - "8"

permissions:
  contents: read
  actions: read

concurrency:
  group: song-study-fill-blank-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: ${{ startsWith(inputs.target, 'production') && 'Production' || 'Staging' }} 1156 ${{ endsWith(inputs.target, '-audit') && 'audit' || endsWith(inputs.target, '-canary') && 'canary' || 'fleet' }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 240
    environment: ${{ startsWith(inputs.target, 'production') && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Resolve pinned API and reviewed Core runner
        id: refs
        working-directory: web
        shell: bash
        run: |
          echo "api_sha=$(<.github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"
          echo "core_sha=$(<.github/release-refs/core.sha)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ steps.refs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ steps.refs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Validate target, confirmation, and canary evidence
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          DATABASE_NAME: ${{ inputs.database_name }}
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$TARGET" == production-* ]]; then
            environment_name="PRODUCTION"
            database_pattern='^community-d1-pool-[0-9]{4}-prod$'
          else
            environment_name="STAGING"
            database_pattern='^community-d1-pool-[0-9]{4}-staging$'
          fi
          if [[ "$TARGET" == *-audit ]]; then action="AUDIT"; else action="APPLY"; fi
          expected="$action 1156 TO $environment_name"
          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo "::error::Confirmation must be exactly: $expected"
            exit 1
          fi
          if [[ "$TARGET" == *-canary ]]; then
            if [[ ! "$DATABASE_NAME" =~ $database_pattern ]]; then
              echo "::error::Canary target requires an exact database name matching $database_pattern"
              exit 1
            fi
            if [[ ! "$AUDIT_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Canary target requires the numeric full-fleet audit run ID used for selection"
              exit 1
            fi
          elif [[ -n "$DATABASE_NAME" || -n "$AUDIT_RUN_ID" ]]; then
            echo "::error::database_name and canary evidence inputs are only valid for canary targets"
            exit 1
          fi

      - name: Resolve referenced full-fleet audit artifact
        if: ${{ endsWith(inputs.target, '-canary') }}
        id: audit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          TARGET: ${{ inputs.target }}
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: |
            const runId = Number(process.env.AUDIT_RUN_ID);
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: runId });
            if (run.conclusion !== "success") {
              core.setFailed(`Referenced audit run ${runId} did not conclude successfully.`);
              return;
            }
            if (!run.path?.startsWith(".github/workflows/song-study-fill-blank-fleet-migration.yml")) {
              core.setFailed(`Referenced run ${runId} is not the fill-blank fleet workflow.`);
              return;
            }
            const auditTarget = process.env.TARGET.replace(/-canary$/, "-audit");
            const expectedPrefix = `song-study-fill-blank-${auditTarget}-${runId}-`;
            const response = await github.rest.actions.listWorkflowRunArtifacts({ owner, repo, run_id: runId, per_page: 100 });
            const matches = response.data.artifacts.filter(
              (artifact) => artifact.name.startsWith(expectedPrefix) && !artifact.expired,
            );
            if (matches.length !== 1) {
              core.setFailed(`Referenced run ${runId} has ${matches.length} current ${auditTarget} artifact(s); expected exactly one.`);
              return;
            }
            core.setOutput("artifact_name", matches[0].name);

      - name: Download referenced full-fleet audit
        if: ${{ endsWith(inputs.target, '-canary') }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          run-id: ${{ inputs.audit_run_id }}
          name: ${{ steps.audit.outputs.artifact_name }}
          path: audit-evidence

      - name: Validate reviewed migration and runner are pinned
        shell: bash
        run: |
          test -f "$GITHUB_WORKSPACE/core/db/community-template/migrations/1156_song_study_fill_blank.sql"
          test -f "$GITHUB_WORKSPACE/core/scripts/community/apply-song-study-fill-blank-d1-migration.ts"

      - name: Read-only canary preflight against audit evidence
        if: ${{ endsWith(inputs.target, '-canary') }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          DATABASE_NAME: ${{ inputs.database_name }}
          AUDIT_RUN_ID: ${{ inputs.audit_run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          mkdir -p migration-output
          args=(
            --wrangler-config api/services/community-d1-shard/wrangler.jsonc
            --migrations-dir core/db/community-template/migrations
            --quarantines core/scripts/community/community-shard-quarantines.json
            --manifest migration-output/canary-preflight.json
            --concurrency 1
            --only "$DATABASE_NAME"
          )
          if [[ "$TARGET" == production-* ]]; then args+=(--prod); fi
          bun core/scripts/community/apply-song-study-fill-blank-d1-migration.ts "${args[@]}"
          expected_fleet="${TARGET%-canary}"
          jq -e \
            --arg fleet "$expected_fleet" \
            --arg database_name "$DATABASE_NAME" \
            --slurpfile preflight migration-output/canary-preflight.json \
            '.fleet == $fleet
              and .migration == "1156_song_study_fill_blank.sql"
              and .checksum == $preflight[0].checksum
              and .executed == false
              and .is_full_verification == true
              and ([.shards[] | select(.database_name == $database_name and .row_counts.song_study_attempt != null)] | length == 1)' \
            audit-evidence/manifest.json >/dev/null
          audited_rows=$(jq -r --arg database_name "$DATABASE_NAME" \
            '.shards[] | select(.database_name == $database_name) | .row_counts.song_study_attempt' \
            audit-evidence/manifest.json)
          actual_rows=$(jq -r '.shards[0].row_counts.song_study_attempt' migration-output/canary-preflight.json)
          if (( actual_rows < audited_rows )); then
            echo "::error::Canary volume shrank since audit run $AUDIT_RUN_ID: audited $audited_rows, observed $actual_rows"
            exit 1
          fi
          jq -n \
            --arg audit_run_id "$AUDIT_RUN_ID" \
            --arg database_name "$DATABASE_NAME" \
            --argjson audited_attempt_rows "$audited_rows" \
            --argjson attempt_rows "$actual_rows" \
            '{audit_run_id: $audit_run_id, database_name: $database_name, audited_attempt_rows: $audited_attempt_rows, preflight_attempt_rows: $attempt_rows}' \
            > migration-output/canary-selection.json

      - name: Audit or apply migration with resumable fleet runner
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          DATABASE_NAME: ${{ inputs.database_name }}
          MIGRATION_CONCURRENCY: ${{ inputs.concurrency }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          mkdir -p migration-output
          args=(
            --wrangler-config api/services/community-d1-shard/wrangler.jsonc
            --migrations-dir core/db/community-template/migrations
            --quarantines core/scripts/community/community-shard-quarantines.json
            --manifest migration-output/manifest.json
            --concurrency "$MIGRATION_CONCURRENCY"
          )
          if [[ "$TARGET" != *-audit ]]; then
            args+=(--resume-file migration-output/resume.txt --confirm-time-travel --execute)
          fi
          if [[ "$TARGET" == production-* ]]; then args+=(--prod); fi
          if [[ "$TARGET" == *-canary ]]; then args+=(--only "$DATABASE_NAME"); fi
          bun core/scripts/community/apply-song-study-fill-blank-d1-migration.ts "${args[@]}"

      - name: Verify final target state read-only
        if: ${{ !endsWith(inputs.target, '-audit') }}
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          DATABASE_NAME: ${{ inputs.database_name }}
          MIGRATION_CONCURRENCY: ${{ inputs.concurrency }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          args=(
            --wrangler-config api/services/community-d1-shard/wrangler.jsonc
            --migrations-dir core/db/community-template/migrations
            --quarantines core/scripts/community/community-shard-quarantines.json
            --manifest migration-output/verification-manifest.json
            --concurrency "$MIGRATION_CONCURRENCY"
          )
          if [[ "$TARGET" == production-* ]]; then args+=(--prod); fi
          if [[ "$TARGET" == *-canary ]]; then args+=(--only "$DATABASE_NAME"); fi
          bun core/scripts/community/apply-song-study-fill-blank-d1-migration.ts "${args[@]}"

      - name: Verify rebuilt row counts are preserved
        if: ${{ !endsWith(inputs.target, '-audit') }}
        shell: bash
        run: |
          bun web/scripts/song-study-fill-blank-row-counts.ts \
            migration-output/manifest.json \
            migration-output/verification-manifest.json \
            migration-output/row-count-comparison.json

      - name: Upload migration record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: song-study-fill-blank-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: migration-output
          if-no-files-found: warn
          retention-days: 30
