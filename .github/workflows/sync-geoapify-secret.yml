name: Sync Geoapify Secret

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync:
    name: Sync API worker Geoapify secret
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Sync staging Geoapify secret
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: printf '%s' "$GEOAPIFY_API_KEY" | bunx wrangler secret put GEOAPIFY_API_KEY --env staging
      - name: Sync production Geoapify secret
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: printf '%s' "$GEOAPIFY_API_KEY" | bunx wrangler secret put GEOAPIFY_API_KEY --env production
      - name: Verify staging secret listed
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler secret list --env staging --format json | node -e 'let input=""; process.stdin.on("data",(chunk)=>input+=chunk); process.stdin.on("end",()=>{ const names = new Set(JSON.parse(input).map((entry) => entry.name)); if (!names.has("GEOAPIFY_API_KEY")) process.exit(1); });'
      - name: Verify production secret listed
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bunx wrangler secret list --env production --format json | node -e 'let input=""; process.stdin.on("data",(chunk)=>input+=chunk); process.stdin.on("end",()=>{ const names = new Set(JSON.parse(input).map((entry) => entry.name)); if (!names.has("GEOAPIFY_API_KEY")) process.exit(1); });'
