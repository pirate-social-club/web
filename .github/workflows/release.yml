name: Release

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-refs/**
      - scripts/deploy-staging.sh
      - scripts/deploy-production.sh
      - scripts/lib/release-source.sh
  workflow_dispatch:

# Serialize releases per ref. cancel-in-progress stays false so a run that is
# already applying migrations or deploying production is never killed midway;
# staleness is handled by the production-freshness job instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-inputs:
    name: Verify release inputs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    outputs:
      api_sha: ${{ steps.api_ref.outputs.sha }}
      core_sha: ${{ steps.core_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Read pinned API commit
        id: api_ref
        working-directory: web
        shell: bash
        run: |
          api_sha="$(< .github/release-refs/api.sha)"
          if [[ ! "$api_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/api.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$api_sha" >> "$GITHUB_OUTPUT"
      - name: Read pinned Core commit
        id: core_ref
        working-directory: web
        shell: bash
        run: |
          core_sha="$(< .github/release-refs/core.sha)"
          if [[ ! "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/core.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$core_sha" >> "$GITHUB_OUTPUT"
      - name: Require compatible green API/Core pair
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          API_SHA: ${{ steps.api_ref.outputs.sha }}
          CORE_SHA: ${{ steps.core_ref.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: |
            const apiSha = process.env.API_SHA;
            const coreSha = process.env.CORE_SHA;
            const [apiRuns, coreRuns] = await Promise.all([
              github.rest.actions.listWorkflowRuns({
                owner: "pirate-social-club",
                repo: "api",
                workflow_id: "api-ci.yml",
                head_sha: apiSha,
                status: "completed",
                per_page: 100,
              }),
              github.rest.actions.listWorkflowRuns({
                owner: "pirate-social-club",
                repo: "core",
                workflow_id: "core-ci.yml",
                head_sha: coreSha,
                status: "completed",
                per_page: 100,
              }),
            ]);
            const successfulApiRun = apiRuns.data.workflow_runs.find((run) =>
              run.head_sha === apiSha &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.conclusion === "success"
            );
            if (!successfulApiRun) {
              core.setFailed(
                `Pinned API commit ${apiSha} has no successful completed api-ci main push run.`
              );
              return;
            }
            const successfulCoreRun = coreRuns.data.workflow_runs.find((run) =>
              run.head_sha === coreSha &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.conclusion === "success"
            );
            if (!successfulCoreRun) {
              core.setFailed(
                `Pinned Core commit ${coreSha} has no successful completed core-ci main push run.`
              );
              return;
            }

            let apiCoreRef;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: "pirate-social-club",
                repo: "api",
                path: ".github/ci-refs/core.sha",
                ref: apiSha,
              });
              if (Array.isArray(data) || data.type !== "file" || !data.content) {
                throw new Error("Core CI reference is not a readable file");
              }
              apiCoreRef = Buffer.from(data.content, "base64").toString("utf8").trim();
            } catch (error) {
              core.setFailed(
                `Unable to read the Core CI reference from API ${apiSha}: ${error.message}`
              );
              return;
            }
            if (apiCoreRef !== coreSha) {
              core.setFailed(
                `API ${apiSha} was tested with Core ${apiCoreRef}, not release Core ${coreSha}.`
              );
              return;
            }

            core.notice(`Pinned API/Core compatibility pair passed CI: ${apiSha} / ${coreSha}`);
            await core.summary
              .addHeading("Pinned release inputs")
              .addTable([
                [{ data: "Repository", header: true }, { data: "Commit", header: true }, { data: "CI proof", header: true }],
                ["API", apiSha, `<a href="${successfulApiRun.html_url}">api-ci</a>`],
                ["Core", coreSha, `<a href="${successfulCoreRun.html_url}">core-ci</a>`],
              ])
              .write();

  # Deploy staging and bring its schema up to date. Nothing here talks to a
  # third-party chain or drives a browser: this is the shortest path to a staging
  # environment that the release gate can then exercise.
  staging:
    name: Deploy staging
    needs: release-inputs
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Verify Core checkout
        working-directory: web
        shell: bash
        env:
          CORE_RELEASE_SHA: ${{ needs.release-inputs.outputs.core_sha }}
        run: |
          source scripts/lib/release-source.sh
          require_clean_release_source "$GITHUB_WORKSPACE/core" "core" "$CORE_RELEASE_SHA"
          echo "Using pinned Core commit $CORE_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Audit web dependencies
        working-directory: web
        # rwsdk currently depends on decompress@4.2.1; no patched decompress release
        # exists yet. Keep the audit strict while ignoring only that upstream advisory.
        run: bun audit --audit-level=high --ignore GHSA-mp2f-45pm-3cg9
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Audit shared dependencies
        working-directory: api/services/shared
        run: bun audit --audit-level=high
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Audit API dependencies
        working-directory: api/services/api
        run: bun audit --audit-level=high
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      - name: Audit core dependencies
        working-directory: core
        run: npm audit --audit-level=high
      - name: Deploy staging
        working-directory: web
        env:
          API_RELEASE_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_BASE_NETWORK: base-sepolia
          VITE_EFP_ENVIRONMENT: testnet
          VITE_GATE_TREE_BUILDER_ENABLED: "true"
          VITE_PIRATE_APP_ENV: staging
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_REWARDS_ENABLED: "true"
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            scripts/deploy-staging.sh
          else
            scripts/deploy-staging.sh --allow-non-main -m "GitHub Actions staging validation for ${GITHUB_REF_NAME} (${GITHUB_RUN_ID})"
          fi
      - name: Verify staging/prod metadata
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/check-deployments.sh --scope staging --retry-for 30
      - name: Smoke staging
        working-directory: web
        run: scripts/smoke-test.sh staging
      - name: Fetch staging control-plane migration secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: a7b5d0b2-0891-4b63-b0e6-946a8c513458
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Apply staging control-plane migrations
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/control-plane/migrations \
            --label control-plane
      - name: Apply staging bookings migrations
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/bookings/migrations \
            --label bookings
      - name: Apply multipart fixture D1 migration
        # Keep D1 access isolated from the broader Worker deployment token.
        # Fixture migration failures must block promotion to production.
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          E2E_MULTIPART_GATE_D1_DATABASE: COMMUNITY_DB
          E2E_MULTIPART_GATE_D1_CONFIG: scripts/wrangler.multipart-fixture.jsonc
          E2E_MULTIPART_GATE_D1_MIGRATION: ../core/db/community-template/migrations/1124_community_job_checkpoints.sql
        run: node scripts/ensure-staging-community-job-checkpoints.mjs

  # Blocking gate. Everything here exercises infrastructure we own: the app boots,
  # auth works, a community follow round-trips, a booking hold quotes, one
  # controlled upload completes, and the song-preview container is healthy.
  # The broad journey suite is deliberately NOT here. Story commerce has its own
  # blocking gate below so an external outage cannot hide a deterministic defect.
  release-gate:
    name: Release gate
    needs: [release-inputs, staging]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      # web/package.json resolves @pirate/api-contracts and @pirate/efp-shared as
      # file:../api/... , so `bun install` in web needs the sibling api tree even
      # though this job never builds or audits the API itself.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke staging
        timeout-minutes: 10
        working-directory: web
        env:
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_API_BASE_URL: https://api-staging.pirate.sc
        run: bun run test:e2e
      - name: Fetch live browser staging secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Verify required gate tests exist
        working-directory: web
        shell: bash
        env:
          E2E_LIVE_STAGING: "true"
        run: |
          set -euo pipefail
          titles=(
            "follows a real staging community and persists after reload"
            "uploads a public video through direct multipart in a real browser"
            "creates and quotes a global booking hold on staging"
          )
          for title in "${titles[@]}"; do
            count=$(bunx playwright test e2e/live-staging.live.spec.ts --project=live-staging --list --grep "$title" 2>&1 | grep -F -c "$title")
            test "$count" -eq 1 || { echo "::error::Expected exactly 1 test matching '$title', found $count"; exit 1; }
          done
      - name: Verify global booking staging smoke
        timeout-minutes: 10
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: bun run test:e2e:required-gate -- e2e/live-staging.live.spec.ts --project=live-staging --grep "creates and quotes a global booking hold on staging"
      - name: Verify staging community follow contract
        timeout-minutes: 10
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: bun run test:e2e:required-gate -- e2e/live-staging.live.spec.ts --project=live-staging --grep "follows a real staging community and persists after reload"
      - name: Verify staging direct multipart browser upload
        timeout-minutes: 10
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_MULTIPART_GATE_COMMUNITY_ID: ${{ vars.E2E_MULTIPART_GATE_COMMUNITY_ID }}
          E2E_MULTIPART_GATE_SUBJECT: ${{ vars.E2E_MULTIPART_GATE_SUBJECT }}
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: bun run test:e2e:required-gate -- e2e/live-staging.live.spec.ts --project=live-staging --grep "uploads a public video through direct multipart in a real browser"
      - name: Fetch staging song preview container health secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: SONG_PREVIEW_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Verify staging song preview container health
        timeout-minutes: 5
        working-directory: web
        run: scripts/check-song-preview-container.sh staging
      - name: Upload release gate Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Deterministic commerce failures remain release-blocking. This runs in
  # parallel with the owned-infrastructure gate, so it adds only its own critical
  # path latency while retaining the projection + verification + settlement proof.
  commerce-gate:
    name: Story commerce gate
    needs: [release-inputs, staging]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Fetch Story commerce staging secrets
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET PIRATE_CHECKOUT_SMOKE_BUYER_PRIVATE_KEY PIRATE_CHECKOUT_RPC_URL PIRATE_CHECKOUT_USDC_TOKEN_ADDRESS STORY_RUNTIME_FUNDER_PRIVATE_KEY
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Story derivative royalty E2E staging
        timeout-minutes: 30
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          PIRATE_STORY_E2E_ARTIFACT_DIR: tmp/e2e-artifacts
          # Preview generation is queued through the API scheduled job runner.
          # Keep this long enough to span several staging cron cycles.
          PIRATE_STORY_E2E_PREVIEW_TIMEOUT_MS: "420000"
        run: bun run test:e2e:story-derivative-royalty
      - name: Upload Story commerce artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: story-derivative-royalty-${{ github.run_id }}-${{ github.run_attempt }}
          path: web/tmp/e2e-artifacts/*.json
          if-no-files-found: ignore
          retention-days: 14

  # Guard against an older run overwriting a newer production deployment. Checked
  # as late as possible — after both gates, immediately before deploying.
  production-freshness:
    name: Check release freshness
    needs: [release-gate, commerce-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Compare run SHA against current main tip
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const tip = ref.object.sha;
            if (tip !== context.sha) {
              core.setOutput("stale", "true");
              core.warning(
                `Skipping production deploy: main has advanced to ${tip}, but this run built ${context.sha}. ` +
                `The release for ${tip} deploys instead.`
              );
              return;
            }
            core.setOutput("stale", "false");
            core.notice(`Run SHA ${context.sha} is the current main tip; proceeding to production.`);

  production:
    name: Deploy production
    needs: [release-inputs, release-gate, commerce-gate, production-freshness]
    # Only deploy production on a push to main. This keeps workflow_dispatch on
    # any branch (e.g. release/* validation) staging-only, so a manual dispatch
    # can never push an unmerged branch to production.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.production-freshness.outputs.stale == 'false'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Verify Core checkout
        working-directory: web
        shell: bash
        env:
          CORE_RELEASE_SHA: ${{ needs.release-inputs.outputs.core_sha }}
        run: |
          source scripts/lib/release-source.sh
          require_clean_release_source "$GITHUB_WORKSPACE/core" "core" "$CORE_RELEASE_SHA"
          echo "Using pinned Core commit $CORE_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Audit web dependencies
        working-directory: web
        # rwsdk currently depends on decompress@4.2.1; no patched decompress release
        # exists yet. Keep the audit strict while ignoring only that upstream advisory.
        run: bun audit --audit-level=high --ignore GHSA-mp2f-45pm-3cg9
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Audit shared dependencies
        working-directory: api/services/shared
        run: bun audit --audit-level=high
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Audit API dependencies
        working-directory: api/services/api
        run: bun audit --audit-level=high
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      - name: Audit core dependencies
        working-directory: core
        run: npm audit --audit-level=high
      - name: Fetch production control-plane migration secret
        continue-on-error: true
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: ec0ad659-af1c-4009-a845-9e6092cc062b
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Apply production control-plane migrations
        working-directory: core
        run: |
          if [ -z "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}" ]; then
            echo "::notice::Skipping production control-plane migrations because CONTROL_PLANE_MIGRATOR_DATABASE_URL is unavailable."
            exit 0
          fi
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/control-plane/migrations \
            --label control-plane
      - name: Apply production bookings migrations
        working-directory: core
        run: |
          if [ -z "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}" ]; then
            echo "::notice::Skipping production bookings migrations because CONTROL_PLANE_MIGRATOR_DATABASE_URL is unavailable."
            exit 0
          fi
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/bookings/migrations \
            --label bookings
      - name: Deploy production
        working-directory: web
        env:
          API_RELEASE_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_BASE_NETWORK: ${{ vars.VITE_BASE_NETWORK }}
          VITE_EFP_ENVIRONMENT: ${{ vars.VITE_EFP_ENVIRONMENT }}
          VITE_PIRATE_APP_ENV: ${{ vars.VITE_PIRATE_APP_ENV || 'prod' }}
          VITE_ASYNC_SONG_PUBLISH_ENABLED: ${{ vars.VITE_ASYNC_SONG_PUBLISH_ENABLED || 'false' }}
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ vars.VITE_PRIVY_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: scripts/deploy-production.sh --confirm-production --skip-tests

  # Non-blocking broad journey canary. Deterministic Story commerce validation is
  # release-blocking above; this suite remains an alerted signal for wider UI and
  # third-party journeys without making every journey a production prerequisite.
  canaries:
    name: Live browser canary (non-blocking)
    needs: [release-inputs, staging]
    if: github.event_name != 'pull_request'
    continue-on-error: true
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      live_browser: ${{ steps.live_browser.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      # web/package.json resolves @pirate/api-contracts and @pirate/efp-shared as
      # file:../api/... , so `bun install` in web needs the sibling api tree even
      # though this job never builds or audits the API itself.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Fetch canary staging secrets
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET PIRATE_CHECKOUT_SMOKE_BUYER_PRIVATE_KEY PIRATE_CHECKOUT_RPC_URL PIRATE_CHECKOUT_USDC_TOKEN_ADDRESS STORY_RUNTIME_FUNDER_PRIVATE_KEY
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Live browser journey canary
        id: live_browser
        continue-on-error: true
        timeout-minutes: 30
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
        run: bun run test:e2e:live-staging
      - name: Upload canary Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canary-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Summarize canary results
        if: always()
        shell: bash
        env:
          LIVE_BROWSER_OUTCOME: ${{ steps.live_browser.outcome }}
        run: |
          {
            echo "### Live canaries"
            echo ""
            echo "| Canary | Outcome |"
            echo "| --- | --- |"
            echo "| Live browser journeys | ${LIVE_BROWSER_OUTCOME} |"
            echo ""
            echo "Canaries do not block production. Failures are tracked in the canary issue."
          } >> "$GITHUB_STEP_SUMMARY"

  # Durable alerting: keep one tracking issue current so a persistently broken
  # canary cannot be ignored just because releases stay green.
  canary-alert:
    name: Report canary failures
    needs: canaries
    if: >-
      always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
      && needs.canaries.result != 'skipped' && needs.canaries.result != 'cancelled'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the canary tracking issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          LIVE_BROWSER_OUTCOME: ${{ needs.canaries.outputs.live_browser }}
        with:
          script: |
            const label = "canary-failure";
            const liveBrowser = process.env.LIVE_BROWSER_OUTCOME || "";
            // The canary job died before the step reported. Stay silent rather
            // than raise a canary alarm for what is really a job-infrastructure fault.
            if (!liveBrowser) {
              core.warning("Canary job reported no step outcomes; skipping canary issue update.");
              return;
            }
            const describe = (outcome) => outcome || "did not complete";
            const failed = [
              liveBrowser !== "success" ? `Live browser journeys: **${describe(liveBrowser)}**` : null,
            ].filter(Boolean);

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: label,
              per_page: 1,
            });
            const existing = open[0];
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            if (failed.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `All canaries passed on \`${context.sha}\` (${runUrl}). Closing.`,
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "closed",
                });
              }
              return;
            }

            const body = [
              `Canary failure on \`${context.sha}\`.`,
              "",
              ...failed.map((line) => `- ${line}`),
              "",
              `Run: ${runUrl}`,
              "",
              "Canaries are non-blocking: production still deployed. Investigate from the uploaded artifacts, not by pushing to main.",
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Release canary failing",
              labels: [label],
              body,
            });
