name: web-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: unit-tests (${{ matrix.shard }}/4)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Check out API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Run unit and component tests
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: 4
        run: |
          set -uo pipefail

          mapfile -t test_files < <(
            find src packages -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              -print | sort
          )

          failures=0
          selected=0
          for index in "${!test_files[@]}"; do
            if (( index % TEST_SHARD_COUNT != TEST_SHARD - 1 )); then
              continue
            fi

            test_file="${test_files[$index]}"
            selected=$((selected + 1))
            echo "::group::${test_file}"
            if ! bun test "${test_file}" --timeout=15000; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          echo "Shard ${TEST_SHARD}/${TEST_SHARD_COUNT}: ${selected} files, ${failures} failed"
          if (( failures > 0 )); then
            exit 1
          fi
