name: Cloudflare cron auth probe

on:
  push:
    branches:
      - codex/cloudflare-cron-auth-probe-20260823

permissions:
  contents: read

jobs:
  attach-staging-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify deploy token and attach the intended staging schedule
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID
          const token = process.env.CLOUDFLARE_API_TOKEN
          if (!accountId || !token) {
            throw new Error("Cloudflare deployment credentials are unavailable")
          }

          const api = "https://api.cloudflare.com/client/v4"
          const headers = {
            authorization: `Bearer ${token}`,
            "content-type": "application/json",
          }

          async function request(label, url, init = {}) {
            const response = await fetch(url, { ...init, headers })
            const body = await response.json().catch(() => ({}))
            const errors = Array.isArray(body.errors)
              ? body.errors.map(({ code, message }) => ({ code, message }))
              : []
            console.log(JSON.stringify({ label, status: response.status, success: body.success === true, errors }))
            return { response, body }
          }

          async function main() {
            await request("token-verify", `${api}/user/tokens/verify`)
            const curatorSchedulesUrl = `${api}/accounts/${accountId}/workers/scripts/country-board-curator/schedules`
            for (const cron of ["0 * * * *", "0 13 * * *"]) {
              const removed = await request(`curator-delete-${cron}`, `${curatorSchedulesUrl}/${encodeURIComponent(cron)}`, {
                method: "DELETE",
              })
              if (!removed.response.ok || removed.body.success !== true) {
                process.exitCode = 1
                return
              }
            }
            await request("curator-schedules-after", curatorSchedulesUrl)

            const schedulesUrl = `${api}/accounts/${accountId}/workers/scripts/pirate-api-staging/schedules`
            await request("schedules-before", schedulesUrl)
            const attached = await request("schedule-create", schedulesUrl, {
              method: "PUT",
              body: JSON.stringify([{ cron: "*/1 * * * *" }]),
            })
            if (!attached.response.ok || attached.body.success !== true) {
              process.exitCode = 1
              return
            }
            await request("schedules-after", schedulesUrl)
          }

          main().catch((error) => {
            console.error(error instanceof Error ? error.message : String(error))
            process.exitCode = 1
          })
          NODE
