name: Release

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/release-refs/**
      - scripts/deploy-staging.sh
      - scripts/deploy-production.sh
      - scripts/lib/release-source.sh
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-inputs:
    name: Verify release inputs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    outputs:
      api_sha: ${{ steps.api_ref.outputs.sha }}
      core_sha: ${{ steps.core_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - name: Read pinned API commit
        id: api_ref
        working-directory: web
        shell: bash
        run: |
          api_sha="$(< .github/release-refs/api.sha)"
          if [[ ! "$api_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/api.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$api_sha" >> "$GITHUB_OUTPUT"
      - name: Read pinned Core commit
        id: core_ref
        working-directory: web
        shell: bash
        run: |
          core_sha="$(< .github/release-refs/core.sha)"
          if [[ ! "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/core.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$core_sha" >> "$GITHUB_OUTPUT"
      - name: Require compatible green API/Core pair
        uses: actions/github-script@v8
        env:
          API_SHA: ${{ steps.api_ref.outputs.sha }}
          CORE_SHA: ${{ steps.core_ref.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: |
            const apiSha = process.env.API_SHA;
            const coreSha = process.env.CORE_SHA;
            const [apiRuns, coreRuns] = await Promise.all([
              github.rest.actions.listWorkflowRuns({
                owner: "pirate-social-club",
                repo: "api",
                workflow_id: "api-ci.yml",
                head_sha: apiSha,
                status: "completed",
                per_page: 100,
              }),
              github.rest.actions.listWorkflowRuns({
                owner: "pirate-social-club",
                repo: "core",
                workflow_id: "core-ci.yml",
                head_sha: coreSha,
                status: "completed",
                per_page: 100,
              }),
            ]);
            const successfulApiRun = apiRuns.data.workflow_runs.find((run) =>
              run.head_sha === apiSha &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.conclusion === "success"
            );
            if (!successfulApiRun) {
              core.setFailed(
                `Pinned API commit ${apiSha} has no successful completed api-ci main push run.`
              );
              return;
            }
            const successfulCoreRun = coreRuns.data.workflow_runs.find((run) =>
              run.head_sha === coreSha &&
              run.head_branch === "main" &&
              run.event === "push" &&
              run.conclusion === "success"
            );
            if (!successfulCoreRun) {
              core.setFailed(
                `Pinned Core commit ${coreSha} has no successful completed core-ci main push run.`
              );
              return;
            }

            let apiCoreRef;
            try {
              const { data } = await github.rest.repos.getContent({
                owner: "pirate-social-club",
                repo: "api",
                path: ".github/ci-refs/core.sha",
                ref: apiSha,
              });
              if (Array.isArray(data) || data.type !== "file" || !data.content) {
                throw new Error("Core CI reference is not a readable file");
              }
              apiCoreRef = Buffer.from(data.content, "base64").toString("utf8").trim();
            } catch (error) {
              core.setFailed(
                `Unable to read the Core CI reference from API ${apiSha}: ${error.message}`
              );
              return;
            }
            if (apiCoreRef !== coreSha) {
              core.setFailed(
                `API ${apiSha} was tested with Core ${apiCoreRef}, not release Core ${coreSha}.`
              );
              return;
            }

            core.notice(`Pinned API/Core compatibility pair passed CI: ${apiSha} / ${coreSha}`);
            await core.summary
              .addHeading("Pinned release inputs")
              .addTable([
                [{ data: "Repository", header: true }, { data: "Commit", header: true }, { data: "CI proof", header: true }],
                ["API", apiSha, `<a href="${successfulApiRun.html_url}">api-ci</a>`],
                ["Core", coreSha, `<a href="${successfulCoreRun.html_url}">core-ci</a>`],
              ])
              .write();

  staging:
    name: Deploy staging
    needs: release-inputs
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Verify Core checkout
        working-directory: web
        shell: bash
        env:
          CORE_RELEASE_SHA: ${{ needs.release-inputs.outputs.core_sha }}
        run: |
          source scripts/lib/release-source.sh
          require_clean_release_source "$GITHUB_WORKSPACE/core" "core" "$CORE_RELEASE_SHA"
          echo "Using pinned Core commit $CORE_RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Audit web dependencies
        working-directory: web
        # rwsdk currently depends on decompress@4.2.1; no patched decompress release
        # exists yet. Keep the audit strict while ignoring only that upstream advisory.
        run: bun audit --audit-level=high --ignore GHSA-mp2f-45pm-3cg9
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Audit shared dependencies
        working-directory: api/services/shared
        run: bun audit --audit-level=high
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Audit API dependencies
        working-directory: api/services/api
        run: bun audit --audit-level=high
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      - name: Audit core dependencies
        working-directory: core
        run: npm audit --audit-level=high
      - name: Deploy staging
        working-directory: web
        env:
          API_RELEASE_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_BASE_NETWORK: base-sepolia
          VITE_EFP_ENVIRONMENT: testnet
          VITE_PIRATE_APP_ENV: staging
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_REWARDS_ENABLED: "true"
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: scripts/deploy-staging.sh
      - name: Verify staging/prod metadata
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/check-deployments.sh --scope staging --retry-for 30
      - name: Smoke staging
        working-directory: web
        run: scripts/smoke-test.sh staging
      - name: Fetch staging control-plane migration secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: a7b5d0b2-0891-4b63-b0e6-946a8c513458
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Apply staging control-plane migrations
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/control-plane/migrations \
            --label control-plane
      - name: Apply staging bookings migrations
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/bookings/migrations \
            --label bookings
      - name: Fetch staging community migration secrets
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: a7b5d0b2-0891-4b63-b0e6-946a8c513458
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: CONTROL_PLANE_DATABASE_URL TURSO_COMMUNITY_DB_WRAP_KEY
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Apply staging community migrations
        working-directory: core
        run: |
          test -n "$CONTROL_PLANE_DATABASE_URL"
          test -n "$TURSO_COMMUNITY_DB_WRAP_KEY"
          bun scripts/community/repair-community-migration-ledger.ts --execute
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke staging
        working-directory: web
        env:
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_API_BASE_URL: https://api-staging.pirate.sc
        run: bun run test:e2e
      - name: Fetch live browser staging secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Verify follow contract test exists
        working-directory: web
        env:
          E2E_LIVE_STAGING: "true"
        run: |
          count=$(bunx playwright test e2e/live-staging.live.spec.ts --project=live-staging --list --grep "follows a real staging community and persists after reload" 2>&1 | grep -F -c "follows a real staging community and persists after reload")
          test "$count" -eq 1 || { echo "Expected exactly 1 matching test, found $count"; exit 1; }
      - name: Verify direct multipart browser upload test exists
        working-directory: web
        env:
          E2E_LIVE_STAGING: "true"
        run: |
          count=$(bunx playwright test e2e/live-staging.live.spec.ts --project=live-staging --list --grep "uploads a public video through direct multipart in a real browser" 2>&1 | grep -F -c "uploads a public video through direct multipart in a real browser")
          test "$count" -eq 1 || { echo "Expected exactly 1 matching test, found $count"; exit 1; }
      - name: Verify global booking staging smoke test exists
        working-directory: web
        env:
          E2E_LIVE_STAGING: "true"
        run: |
          count=$(bunx playwright test e2e/live-staging.live.spec.ts --project=live-staging --list --grep "creates and quotes a global booking hold on staging" 2>&1 | grep -F -c "creates and quotes a global booking hold on staging")
          test "$count" -eq 1 || { echo "Expected exactly 1 matching test, found $count"; exit 1; }
      - name: Verify global booking staging smoke
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: bun run test:e2e:required-gate -- e2e/live-staging.live.spec.ts --project=live-staging --grep "creates and quotes a global booking hold on staging"
      - name: Verify staging community follow contract
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: bun run test:e2e:required-gate -- e2e/live-staging.live.spec.ts --project=live-staging --grep "follows a real staging community and persists after reload"
      - name: Verify staging direct multipart browser upload
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_MULTIPART_GATE_COMMUNITY_ID: ${{ vars.E2E_MULTIPART_GATE_COMMUNITY_ID }}
          E2E_MULTIPART_GATE_SUBJECT: ${{ vars.E2E_MULTIPART_GATE_SUBJECT }}
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: bun run test:e2e:required-gate -- e2e/live-staging.live.spec.ts --project=live-staging --grep "uploads a public video through direct multipart in a real browser"
      - name: Fetch Story derivative royalty E2E secrets
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: PIRATE_CHECKOUT_SMOKE_BUYER_PRIVATE_KEY PIRATE_CHECKOUT_RPC_URL PIRATE_CHECKOUT_USDC_TOKEN_ADDRESS STORY_RUNTIME_FUNDER_PRIVATE_KEY
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Fetch staging song preview container health secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: SONG_PREVIEW_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Verify staging song preview container health
        timeout-minutes: 5
        working-directory: web
        run: scripts/check-song-preview-container.sh staging
      - name: Story derivative royalty E2E staging
        # This validates the external song-preview/Story path. Keep artifacts
        # for diagnosis, but do not block unrelated production releases after
        # the focused deploy, migration, browser-smoke, and multipart gates pass.
        continue-on-error: true
        timeout-minutes: 30
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          PIRATE_STORY_E2E_ARTIFACT_DIR: tmp/e2e-artifacts
          # Preview generation is queued through the API scheduled job runner.
          # Keep this long enough to span several staging cron cycles.
          PIRATE_STORY_E2E_PREVIEW_TIMEOUT_MS: "420000"
        run: bun run test:e2e:story-derivative-royalty
      - name: Upload Story derivative royalty E2E artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: story-derivative-royalty-${{ github.run_id }}
          path: web/tmp/e2e-artifacts/*.json
          if-no-files-found: ignore
      # This broader live-staging suite is intentionally soft; unrelated staging
      # integrations should not block prod when the focused gates above pass.
      - name: Live browser integration staging
        id: live_browser
        continue-on-error: true
        timeout-minutes: 5
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.AUTH_UPSTREAM_JWT_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.AUTH_UPSTREAM_JWT_ISSUER }}
        run: timeout 300s bun run test:e2e:live-staging
      - name: Upload Playwright report
        if: ${{ failure() || steps.live_browser.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
  production:
    name: Deploy production
    needs: [release-inputs, staging]
    # Only deploy production on a push to main. This keeps workflow_dispatch on
    # any branch (e.g. release/* validation) staging-only, so a manual dispatch
    # can never push an unmerged branch to production.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: web
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Verify Core checkout
        working-directory: web
        shell: bash
        env:
          CORE_RELEASE_SHA: ${{ needs.release-inputs.outputs.core_sha }}
        run: |
          source scripts/lib/release-source.sh
          require_clean_release_source "$GITHUB_WORKSPACE/core" "core" "$CORE_RELEASE_SHA"
          echo "Using pinned Core commit $CORE_RELEASE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Audit web dependencies
        working-directory: web
        # rwsdk currently depends on decompress@4.2.1; no patched decompress release
        # exists yet. Keep the audit strict while ignoring only that upstream advisory.
        run: bun audit --audit-level=high --ignore GHSA-mp2f-45pm-3cg9
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Audit shared dependencies
        working-directory: api/services/shared
        run: bun audit --audit-level=high
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Audit API dependencies
        working-directory: api/services/api
        run: bun audit --audit-level=high
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      - name: Audit core dependencies
        working-directory: core
        run: npm audit --audit-level=high
      - name: Fetch production control-plane migration secret
        continue-on-error: true
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: ec0ad659-af1c-4009-a845-9e6092cc062b
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Apply production control-plane migrations
        working-directory: core
        run: |
          if [ -z "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}" ]; then
            echo "::notice::Skipping production control-plane migrations because CONTROL_PLANE_MIGRATOR_DATABASE_URL is unavailable."
            exit 0
          fi
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/control-plane/migrations \
            --label control-plane
      - name: Apply production bookings migrations
        working-directory: core
        run: |
          if [ -z "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}" ]; then
            echo "::notice::Skipping production bookings migrations because CONTROL_PLANE_MIGRATOR_DATABASE_URL is unavailable."
            exit 0
          fi
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/bookings/migrations \
            --label bookings
      - name: Deploy production
        working-directory: web
        env:
          API_RELEASE_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_BASE_NETWORK: ${{ vars.VITE_BASE_NETWORK }}
          VITE_EFP_ENVIRONMENT: ${{ vars.VITE_EFP_ENVIRONMENT }}
          VITE_PIRATE_APP_ENV: ${{ vars.VITE_PIRATE_APP_ENV || 'prod' }}
          VITE_ASYNC_SONG_PUBLISH_ENABLED: ${{ vars.VITE_ASYNC_SONG_PUBLISH_ENABLED || 'false' }}
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ vars.VITE_PRIVY_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: scripts/deploy-production.sh --confirm-production --skip-tests
