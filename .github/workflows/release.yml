name: Release

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  staging:
    name: Deploy staging API preview CTA
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          ref: deploy/telegram-private-preview-cta
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Audit API dependencies
        working-directory: api/services/api
        run: bun audit --audit-level=high
      - name: Deploy staging API
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          API_SHA="$(git -C ../.. rev-parse --short HEAD)-non-main-private-preview-cta"
          API_REF="$(git -C ../.. rev-parse --abbrev-ref HEAD)"
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          bun run deploy -- \
            --env staging \
            --var "BUILD_GIT_SHA:$API_SHA" \
            --var "BUILD_GIT_REF:$API_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP" \
            --define "__PIRATE_BUILD_GIT_SHA__:\"$API_SHA\"" \
            --define "__PIRATE_BUILD_GIT_REF__:\"$API_REF\"" \
            --define "__PIRATE_BUILD_TIMESTAMP__:\"$BUILD_TIMESTAMP\""
      - name: Smoke staging API metadata
        run: |
          curl -fsS https://api-staging.pirate.sc/health
          node - <<'NODE'
          const expectedSha = "d7578d5-non-main-private-preview-cta";
          const attempts = 12;
          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            const response = await fetch("https://api-staging.pirate.sc/__version", {
              headers: { accept: "application/json", "cache-control": "no-cache" },
            });
            if (response.ok) {
              const body = await response.json();
              if (body.git_sha === expectedSha) {
                console.log(`api-staging git_sha=${body.git_sha}`);
                process.exit(0);
              }
              console.log(`attempt ${attempt}: git_sha=${body.git_sha}`);
            } else {
              console.log(`attempt ${attempt}: HTTP ${response.status}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 5000));
          }
          throw new Error(`api-staging did not report ${expectedSha}`);
          NODE
