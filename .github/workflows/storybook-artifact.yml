name: Storybook artifact

on:
  workflow_dispatch:
    inputs:
      storybook_only:
        description: Optional story subtree relative to src; leave empty for the full catalog
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: storybook-artifact-${{ github.ref }}-${{ inputs.storybook_only || 'all' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Storybook artifact
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out Web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Read pinned API commit
        id: api-pin
        shell: bash
        run: echo "sha=$(tr -d '[:space:]' < .github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api
          ref: ${{ steps.api-pin.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.2.21

      - name: Install Web dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Require focused-discovery support
        if: ${{ inputs.storybook_only != '' }}
        shell: bash
        run: |
          if ! grep -q 'process.env.STORYBOOK_ONLY' .storybook/main.ts; then
            echo "::error::storybook_only requires STORYBOOK_ONLY support in .storybook/main.ts"
            exit 1
          fi

      - name: Build Storybook
        env:
          STORYBOOK_ONLY: ${{ inputs.storybook_only }}
        run: bun run build-storybook

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: storybook-static-${{ github.run_id }}
          path: web/storybook-static/
          if-no-files-found: error
          retention-days: 7
