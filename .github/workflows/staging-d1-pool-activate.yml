name: Staging D1 pool activation

on:
  workflow_dispatch:
    inputs:
      api_ref:
        description: Reviewed API commit containing the bindings
        required: true
        type: string
      start_index:
        description: First DB_CMTY index to register
        required: true
        type: number
      count:
        description: Number of contiguous bindings to register
        required: true
        type: number

permissions:
  contents: read

# Same lane as the refill: activation deploys the shard and inserts pool rows, so
# it must never interleave with a refill that is creating databases.
concurrency:
  group: staging-d1-pool-maintenance
  cancel-in-progress: false

jobs:
  activate:
    name: Deploy and register staging D1 bindings
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ inputs.api_ref }}
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install shared dependencies
        working-directory: services/shared
        run: bun install --frozen-lockfile
      - name: Install shard dependencies
        working-directory: services/community-d1-shard
        run: bun install --frozen-lockfile

      # READ-ONLY, before the deploy. The config being activated must contain every
      # binding the pool can still hand out; deploying one that dropped a binding
      # strands the communities living in it.
      - name: Capture pool inventory
        working-directory: services/community-d1-shard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          bunx wrangler@4.100.0 d1 execute community-d1-shard-pool-staging \
            --remote --json --command "SELECT binding_name FROM d1_pool" > pool-bindings.json

      # Strict append-only, judged against the live pool rather than a remembered
      # baseline: config minus pool must equal exactly the planned additions, so a
      # removal, a rename, or unrelated drift all fail closed.
      - name: Pre-flight (fails closed on stale config or unexpected delta)
        working-directory: services/community-d1-shard
        run: |
          node "$GITHUB_WORKSPACE/web/scripts/ci/staging-pool-preflight.mjs" \
            --mode activate \
            --pool-json pool-bindings.json \
            --config wrangler.jsonc \
            --start '${{ inputs.start_index }}' \
            --count '${{ inputs.count }}'

      - name: Upload pre-flight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-d1-pool-activation-preflight-${{ github.run_id }}
          path: services/community-d1-shard/pool-bindings.json
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy reviewed staging shard bindings
        working-directory: services/community-d1-shard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          API_REF: ${{ inputs.api_ref }}
        run: |
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          API_SHA="$(git rev-parse HEAD)"
          SHARD_SOURCE_VERSION="$(
            printf '%s.%s' \
              "$(git rev-parse HEAD:services/community-d1-shard)" \
              "$(git rev-parse HEAD:services/shared)"
          )"
          bunx wrangler deploy --env="" \
            --define "__PIRATE_BUILD_GIT_SHA__:\"$API_SHA\"" \
            --define "__PIRATE_BUILD_GIT_REF__:\"reviewed/$API_REF\"" \
            --define "__PIRATE_BUILD_TIMESTAMP__:\"$BUILD_TIMESTAMP\"" \
            --define "__PIRATE_COMMUNITY_D1_SHARD_SOURCE_VERSION__:\"$SHARD_SOURCE_VERSION\""
      - name: Register free staging pool rows
        working-directory: services/community-d1-shard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          START_INDEX: ${{ inputs.start_index }}
          BINDING_COUNT: ${{ inputs.count }}
        run: |
          SQL="$(bun -e '
            import { buildPoolInsertSql, planPoolBindings } from "./scripts/allocate-d1-pool.ts";
            const bindings = planPoolBindings(Number(process.env.START_INDEX), Number(process.env.BINDING_COUNT));
            process.stdout.write(buildPoolInsertSql(bindings.map((entry) => entry.bindingName)));
          ')"
          bunx wrangler d1 execute community-d1-shard-pool-staging --remote --command "$SQL"
      - name: Verify staging provisioning capacity
        run: |
          node - <<'NODE'
          const response = await fetch("https://api-staging.pirate.sc/health/provisioning", {
            headers: { "cache-control": "no-cache" },
          });
          const body = await response.json();
          console.log(JSON.stringify(body));
          if (!response.ok || body?.pool_capacity?.healthy !== true) process.exit(1);
          NODE
