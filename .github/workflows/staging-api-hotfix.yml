name: Staging API Hotfix

on:
  workflow_dispatch:
    inputs:
      api_ref:
        description: API ref to deploy
        required: true
        default: telegram-start-copy-hotfix

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy staging API
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pirate-social-club/api
          ref: ${{ inputs.api_ref }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install API dependencies
        working-directory: api/services/api
        run: bun install --frozen-lockfile
      - name: Run Telegram copy tests
        working-directory: api
        run: bun test services/api/tests/lib/telegram/telegram-copy.test.ts
      - name: Deploy staging API
        working-directory: api/services/api
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          API_SHA="$(git rev-parse --short HEAD)"
          API_REF="${{ inputs.api_ref }}"
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ./node_modules/.bin/wrangler deploy \
            --env staging \
            --var "BUILD_GIT_SHA:$API_SHA" \
            --var "BUILD_GIT_REF:$API_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP" \
            --define "__PIRATE_BUILD_GIT_SHA__:\"$API_SHA\"" \
            --define "__PIRATE_BUILD_GIT_REF__:\"$API_REF\""
