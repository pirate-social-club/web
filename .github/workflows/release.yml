name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
      - opened
      - reopened
      - synchronize
      - unlabeled
    paths:
      - .github/workflows/release.yml
      - .github/release-refs/**
      - scripts/deploy-staging.sh
      - scripts/deploy-production.sh
      - scripts/lib/release-source.sh
  workflow_dispatch:
    inputs:
      expected_staging_web_sha:
        description: Optional deployed Web SHA for the focused gate-builder verification
        required: false
        type: string
      expected_staging_api_sha:
        description: Optional deployed API SHA for the focused gate-builder verification
        required: false
        type: string
      deploy_production:
        description: Deploy the validated current main commit to production
        required: false
        default: false
        type: boolean

# NO workflow-level concurrency. Serializing the whole workflow per ref made every
# merge queue behind the previous release end-to-end; with a ~20min release and a
# push every ~10min the queue never drained (runs observed waiting 70min, then
# getting cancelled unrun because GitHub keeps only one pending run per group).
#
# Serialization now sits on the two jobs that actually MUTATE a shared
# environment, so validation runs overlap freely but deployments never do:
#   staging     -> concurrency: staging-promotion
#   production  -> concurrency: production-deploy
#
# Both keep cancel-in-progress: false — a run applying migrations or deploying
# production must never be killed midway. Staleness is handled by terminating
# superseded runs BEFORE they enter a lane (staging-freshness / production-
# freshness), and by re-asserting the deployed SHAs around each staging gate.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-inputs:
    name: Verify release inputs
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
    outputs:
      api_sha: ${{ steps.api_ref.outputs.sha }}
      core_sha: ${{ steps.core_ref.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Read pinned API commit
        id: api_ref
        working-directory: web
        shell: bash
        run: |
          api_sha="$(< .github/release-refs/api.sha)"
          if [[ ! "$api_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/api.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$api_sha" >> "$GITHUB_OUTPUT"
      - name: Read pinned Core commit
        id: core_ref
        working-directory: web
        shell: bash
        run: |
          core_sha="$(< .github/release-refs/core.sha)"
          if [[ ! "$core_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::.github/release-refs/core.sha must contain one full lowercase commit SHA"
            exit 1
          fi
          echo "sha=$core_sha" >> "$GITHUB_OUTPUT"
      - name: Require compatible green API/Core pair
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          API_SHA: ${{ steps.api_ref.outputs.sha }}
          CORE_SHA: ${{ steps.core_ref.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: |
            const apiSha = process.env.API_SHA;
            const coreSha = process.env.CORE_SHA;
            const proof = await github.graphql(`
              query($apiSha: GitObjectID!, $coreSha: GitObjectID!, $apiCoreRef: String!) {
                api: repository(owner: "pirate-social-club", name: "api") {
                  commit: object(oid: $apiSha) {
                    ... on Commit {
                      checkSuites(first: 100) {
                        nodes {
                          branch { name }
                          conclusion
                          workflowRun {
                            event
                            url
                            workflow { name }
                          }
                        }
                      }
                    }
                  }
                  coreRef: object(expression: $apiCoreRef) {
                    ... on Blob { text }
                  }
                }
                core: repository(owner: "pirate-social-club", name: "core") {
                  commit: object(oid: $coreSha) {
                    ... on Commit {
                      checkSuites(first: 100) {
                        nodes {
                          branch { name }
                          conclusion
                          workflowRun {
                            event
                            url
                            workflow { name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              apiSha,
              coreSha,
              apiCoreRef: `${apiSha}:.github/ci-refs/core.sha`,
            });
            const successfulApiRun = proof.api?.commit?.checkSuites?.nodes?.find((suite) =>
              suite.branch?.name === "main" &&
              suite.workflowRun?.workflow?.name === "api-ci" &&
              suite.workflowRun.event === "push" &&
              suite.conclusion === "SUCCESS"
            );
            if (!successfulApiRun?.workflowRun) {
              core.setFailed(
                `Pinned API commit ${apiSha} has no successful completed api-ci main push run.`
              );
              return;
            }
            const successfulCoreRun = proof.core?.commit?.checkSuites?.nodes?.find((suite) =>
              suite.branch?.name === "main" &&
              suite.workflowRun?.workflow?.name === "core-ci" &&
              suite.workflowRun.event === "push" &&
              suite.conclusion === "SUCCESS"
            );
            if (!successfulCoreRun?.workflowRun) {
              core.setFailed(
                `Pinned Core commit ${coreSha} has no successful completed core-ci main push run.`
              );
              return;
            }

            const apiCoreRef = proof.api?.coreRef?.text?.trim();
            if (!apiCoreRef) {
              core.setFailed(
                `Unable to read the Core CI reference from API ${apiSha}.`
              );
              return;
            }
            if (apiCoreRef !== coreSha) {
              core.setFailed(
                `API ${apiSha} was tested with Core ${apiCoreRef}, not release Core ${coreSha}.`
              );
              return;
            }

            core.notice(`Pinned API/Core compatibility pair passed CI: ${apiSha} / ${coreSha}`);
            await core.summary
              .addHeading("Pinned release inputs")
              .addTable([
                [{ data: "Repository", header: true }, { data: "Commit", header: true }, { data: "CI proof", header: true }],
                ["API", apiSha, `<a href="${successfulApiRun.workflowRun.url}">api-ci</a>`],
                ["Core", coreSha, `<a href="${successfulCoreRun.workflowRun.url}">core-ci</a>`],
              ])
              .write();
      - name: Require classification for newly pinned community migrations
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        env:
          API_SHA: ${{ steps.api_ref.outputs.sha }}
          CORE_SHA: ${{ steps.core_ref.outputs.sha }}
        with:
          github-token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          script: |
            const { pathToFileURL } = require("node:url");
            const moduleUrl = pathToFileURL(
              `${process.env.GITHUB_WORKSPACE}/web/scripts/community-migration-classification-ratchet.mjs`
            ).href;
            const { enforceCommunityMigrationClassification } = await import(moduleUrl);
            await enforceCommunityMigrationClassification({
              github,
              context,
              actionsCore: core,
              owner: context.repo.owner,
              webRepo: context.repo.repo,
              apiRepo: "api",
              coreRepo: "core",
              apiSha: process.env.API_SHA,
              coreSha: process.env.CORE_SHA,
            });

  # Cheap QUEUE FILTER, not a guarantee. Drops runs that are already superseded
  # when they start, so they never occupy schema-gate or the staging lane and
  # never add latency for the runs behind them.
  #
  # This check is NOT what makes "an older run cannot deploy" true. It runs
  # before schema-gate's ~10min fleet scan, so main can advance afterwards, and
  # nothing orders lane acquisition against it. The authoritative check is
  # in-lane-freshness inside the staging job, taken with the lock held
  # immediately before the first mutation. Keep both: this one saves queue time,
  # that one is the correctness boundary.
  #
  # workflow_dispatch is exempt — a manual staging run on a release/* branch is
  # deliberate and has no "tip" to compare against.
  staging-freshness:
    name: Check staging freshness
    needs: [release-inputs]
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      - name: Compare run SHA against current main tip
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            if (context.eventName !== "push" || context.ref !== "refs/heads/main") {
              core.setOutput("stale", "false");
              core.notice("Not a push to main; staging promotion proceeds.");
              return;
            }
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const tip = ref.object.sha;
            if (tip !== context.sha) {
              core.setOutput("stale", "true");
              core.warning(
                `Skipping staging promotion: main has advanced to ${tip}, but this run built ${context.sha}. ` +
                `The release for ${tip} promotes instead.`
              );
              return;
            }
            core.setOutput("stale", "false");
            core.notice(`Run SHA ${context.sha} is the current main tip; entering the staging promotion lane.`);

  # Deploy staging and bring its schema up to date. Nothing here talks to a
  # third-party chain or drives a browser: this is the shortest path to a staging
  # environment that the release gate can then exercise.
  staging:
    name: Deploy staging
    # schema-gate runs FIRST: the invariant is "the pinned API may deploy only
    # after the live fleet satisfies its schema requirements". Deploying the
    # pinned API to staging before that check is the exact failure this prevents.
    # The gate reads the existing fleet and needs nothing from this deploy.
    needs: [release-inputs, schema-gate, staging-freshness]
    if: github.event_name != 'pull_request' && needs.staging-freshness.outputs.stale == 'false'
    # The staging promotion lane. Staging is a single shared environment: two runs
    # deploying different commits into it concurrently would let an older run
    # overwrite newer state while the newer run's gates are mid-flight, producing
    # gate results for a SHA that is no longer deployed. This lock makes the
    # deploy itself exclusive; the gates below re-assert the deployed SHAs so a
    # trampled window is detected rather than silently passed.
    concurrency:
      group: staging-promotion
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      superseded: ${{ steps.in-lane-freshness.outputs.stale }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Verify Core checkout
        working-directory: web
        shell: bash
        env:
          CORE_RELEASE_SHA: ${{ needs.release-inputs.outputs.core_sha }}
        run: |
          source scripts/lib/release-source.sh
          require_clean_release_source "$GITHUB_WORKSPACE/core" "core" "$CORE_RELEASE_SHA"
          echo "Using pinned Core commit $CORE_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Install API dependencies
        working-directory: api/services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - name: Install community shard dependencies
        working-directory: api/services/community-d1-shard
        run: bun install --frozen-lockfile
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      # Re-evaluate high-and-above advisories immediately before deployment.
      # The same job is required on pull requests, but advisory publication is a
      # time-varying input: a finding published after merge must still stop the
      # release. Exceptions are explicit, bounded, and expiry-enforced here.
      - name: Audit dependencies for unaccepted high advisories
        working-directory: web
        run: |
          node scripts/ci/dependency-audit.mjs \
            --mode scheduled \
            --baseline .github/dependency-audit-baseline.json \
            --target .:bun \
            --target ../api/services/shared:bun \
            --target ../api/services/api:bun \
            --target ../core:npm
      # IN-LANE freshness. The staging-freshness job is only a cheap queue filter:
      # it runs before schema-gate's ~10min fleet scan, so main can advance while
      # this run is still waiting, and the early check cannot prove the run is
      # current by the time it actually holds the lane. Nothing orders lane
      # acquisition against that check either. So re-check HERE — after the lock
      # is held, immediately before the first mutation — and gate every mutating
      # step below on the result. This is the check that actually enforces "an
      # older run never overwrites newer staging state".
      - name: Re-check freshness inside the staging lane
        id: in-lane-freshness
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            if (context.eventName !== "push" || context.ref !== "refs/heads/main") {
              core.setOutput("stale", "false");
              return;
            }
            const { data: ref } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });
            const tip = ref.object.sha;
            if (tip !== context.sha) {
              core.setOutput("stale", "true");
              core.notice(
                `Superseded: main advanced to ${tip} while this run (${context.sha}) waited for the ` +
                `staging lane. Skipping deploy and migrations; the release for ${tip} promotes instead.`
              );
              return;
            }
            core.setOutput("stale", "false");
      - name: Verify staging community shard transition is safe
        id: staging-shard-preflight
        if: steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: web
        run: |
          node scripts/verify-community-shard-compatibility.mjs \
            --api-dir "$GITHUB_WORKSPACE/api" \
            --environment staging \
            --phase pre-deploy \
            --health-url https://api-staging.pirate.sc/health/provisioning
      - name: Deploy pinned staging community shard first
        if: steps.in-lane-freshness.outputs.stale == 'false' && steps.staging-shard-preflight.outputs.deploy_shard == 'true'
        working-directory: api/services/community-d1-shard
        env:
          BUILD_GIT_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          BUILD_GIT_REF: pinned/${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy -- --env staging
      - name: Verify bounded staging shard-first transition
        if: steps.in-lane-freshness.outputs.stale == 'false' && steps.staging-shard-preflight.outputs.deploy_shard == 'true'
        working-directory: web
        run: |
          node scripts/verify-community-shard-compatibility.mjs \
            --api-dir "$GITHUB_WORKSPACE/api" \
            --environment staging \
            --phase transition \
            --previous-source-version "${{ steps.staging-shard-preflight.outputs.previous_source_version }}" \
            --health-url https://api-staging.pirate.sc/health/provisioning
      - name: Deploy staging
        if: steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: web
        env:
          API_RELEASE_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_BASE_NETWORK: base-sepolia
          VITE_EFP_ENVIRONMENT: testnet
          VITE_GATE_TREE_BUILDER_ENABLED: "true"
          VITE_PIRATE_APP_ENV: staging
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_REWARDS_ENABLED: "true"
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            scripts/deploy-staging.sh
          else
            scripts/deploy-staging.sh --allow-non-main -m "GitHub Actions staging validation for ${GITHUB_REF_NAME} (${GITHUB_RUN_ID})"
          fi
      - name: Require exact staging community shard convergence
        if: steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: web
        run: |
          node scripts/verify-community-shard-compatibility.mjs \
            --api-dir "$GITHUB_WORKSPACE/api" \
            --environment staging \
            --phase converged \
            --health-url https://api-staging.pirate.sc/health/provisioning
      - name: Verify staging/prod metadata
        if: steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: scripts/check-deployments.sh --scope staging --retry-for 30
      - name: Smoke staging
        if: steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: web
        run: scripts/smoke-test.sh staging
      - name: Fetch staging control-plane migration secret
        if: github.ref_name == 'main' && steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: a7b5d0b2-0891-4b63-b0e6-946a8c513458
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Apply staging control-plane migrations
        if: github.ref_name == 'main' && steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/control-plane/migrations \
            --label control-plane
      - name: Apply staging bookings migrations
        if: github.ref_name == 'main' && steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/bookings/migrations \
            --label bookings
      - name: Apply multipart fixture D1 migrations
        # Keep D1 access isolated from the broader Worker deployment token.
        # Fixture migration failures must block promotion to production.
        if: steps.in-lane-freshness.outputs.stale == 'false'
        working-directory: web
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          E2E_MULTIPART_GATE_D1_DATABASE: COMMUNITY_DB
          E2E_MULTIPART_GATE_D1_CONFIG: scripts/wrangler.multipart-fixture.jsonc
          E2E_MULTIPART_GATE_CHECKPOINT_MIGRATION: ../core/db/community-template/migrations/1124_community_job_checkpoints.sql
          E2E_MULTIPART_GATE_STORY_METADATA_MIGRATION: ../core/db/community-template/migrations/1127_asset_story_metadata_refs.sql
        run: node scripts/ensure-staging-community-schema.mjs

  # Blocking gate: does every LIVE staging community shard satisfy the pinned
  # API's declared community-template schema requirements? Nothing gated this
  # before, and it broke production twice (1124, 1127). This is schema
  # ATTESTATION across the whole fleet; the multipart test below is BEHAVIOURAL
  # on one community. They catch different failures — keep both. Read-only.
  schema-gate:
    name: Community schema gate (staging fleet)
    needs: [release-inputs, staging-freshness]
    if: github.event_name != 'pull_request' && needs.staging-freshness.outputs.stale == 'false'
    # The scan is strictly read-only, so a newer main push can safely cancel an
    # obsolete in-flight scan instead of doubling D1 load for another ~20min.
    # Manual dispatches are deliberate and keep an independent group.
    concurrency:
      group: community-schema-gate-${{ github.event_name == 'push' && 'main' || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # 25min, raised from 15 on 2026-07-22. The 15min ceiling sat INSIDE the
    # healthy scan's natural variance, so the runner killed a fail-closed check
    # before it could return a verdict. Measured on consecutive main pushes:
    # 12m26s, 12m47s, 14m44s, 14m59s (all success) — then run 29947790771 took
    # 15m20s and was killed mid-scan, leaving main undeployed. A timed-out job
    # reports as `cancelled`, which reads like supersession, so this failure mode
    # is expensive to diagnose and easy to misattribute.
    #
    # This is CONTAINMENT, not headroom to grow into: it buys a verdict, it does
    # not fix the 12-15min scan latency, which still scales with fleet size. The
    # attestation fast-path is the real fix. Watch the duration recorded in the
    # job summary below — if it climbs toward 25, raise the fast-path, not this.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      # wrangler runs on system Node (bunx invokes its node shebang), and
      # wrangler@4.100.0 requires Node >= 22 — the runner default is v20.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      # Probe D1 access up front. The gate's wrangler wrapper reports only stderr
      # on failure, and `bunx wrangler` writes install progress there, so a real
      # auth error is otherwise masked as "Resolving dependencies". Non-fatal —
      # the gate below is the real check; this just makes any auth error visible.
      - name: Probe staging D1 read access
        continue-on-error: true
        working-directory: api/services/community-d1-shard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          echo "Probing read access to community-d1-shard-pool-staging..."
          bunx wrangler@4.100.0 d1 execute community-d1-shard-pool-staging \
            --remote --json --command "SELECT COUNT(*) AS n FROM d1_pool" 2>&1 || true
      # Fleet-scan duration is the input that invalidated the old ceiling, so make
      # it a first-class number instead of something you reconstruct from job
      # timestamps during an incident. Fleet growth shows up here first.
      - name: Record schema scan start
        run: echo "SCHEMA_SCAN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - name: Verify staging fleet satisfies pinned API schema requirements
        # Keep REST-batch concurrency at 2 after repeated code 7429 overloads
        # exhausted retries on the same staging shard at concurrency 3.
        # The gate reads the community-d1-shard pool + every live shard through
        # the D1 REST API, so it needs D1 READ across
        # community-d1-pool-* and community-d1-shard-pool-*. That is the isolated
        # D1 token (CLOUDFLARE_D1_API_TOKEN), NOT the Worker-deploy token — D1
        # access is deliberately kept off the deploy token (see the multipart
        # fixture step). Read-only: a token-scope gap fails safe, never mutates.
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          bun core/scripts/community/verify-community-schema-requirements.ts \
            --requirements api/services/api/community-schema-requirements.json \
            --wrangler-config api/services/community-d1-shard/wrangler.jsonc \
            --migrations-dir core/db/community-template/migrations \
            --drift-policy core/db/known-community-migration-drifts.json \
            --canonical-baseline api/services/api/docs/attestations/community-schema/staging-canonical-baseline.json \
            --manifest "$GITHUB_WORKSPACE/schema-gate-staging.json" \
            --concurrency 2
      # always(): a SLOW scan that then fails is exactly the sample we must not
      # drop. Never fails the job — an observability step must not be able to
      # block a release.
      - name: Report schema scan duration
        if: always()
        continue-on-error: true
        run: |
          elapsed=$(( $(date +%s) - ${SCHEMA_SCAN_STARTED_AT:-$(date +%s)} ))
          budget=$(( 25 * 60 ))
          printf 'Schema fleet scan: %dm%02ds (job ceiling %dm, %d%% used)\n' \
            "$(( elapsed / 60 ))" "$(( elapsed % 60 ))" "$(( budget / 60 ))" \
            "$(( elapsed * 100 / budget ))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt $(( budget * 70 / 100 )) ]; then
            echo "::warning::Schema fleet scan used ${elapsed}s of the ${budget}s ceiling (>70%). Fleet growth is eroding the margin — pursue the attestation fast-path before raising the timeout again."
          fi
      - name: Upload staging schema manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-gate-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-gate-staging.json
          if-no-files-found: warn
          retention-days: 14

  # Blocking web/runtime gate. The API-owned job below exercises the four required
  # authenticated contracts against the exact API commit deployed by `staging`.
  # External canaries run after this workflow completes in release-canaries.yml.
  release-gate:
    name: Release gate
    needs: [release-inputs, staging]
    # Skip rather than fail when staging was superseded. The SHA assertions below
    # would fail closed anyway, which is safe but indistinguishable from a real
    # regression in the flake statistics. A superseded run is expected
    # obsolescence, not a red test: the run that took the lane gates its own SHA.
    if: github.event_name != 'pull_request' && needs.staging.outputs.superseded != 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      # web/package.json resolves @pirate/api-contracts and @pirate/efp-shared as
      # file:../api/... , so `bun install` in web needs the sibling api tree even
      # though this job never builds or audits the API itself.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      # Bind this gate to the exact SHAs this run deployed. Without the workflow
      # -level lock, another run can enter the staging promotion lane the moment
      # ours releases it, so "staging deployed OK" is no longer proof that our
      # build is what we are about to exercise.
      - name: Require this run's staging artifacts
        id: require-staging-artifacts
        working-directory: web
        env:
          EXPECTED_API_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          EXPECTED_WEB_SHA: ${{ github.sha }}
        run: |
          node scripts/verify-deployed-versions.mjs \
            https://staging.pirate.sc/__version "$EXPECTED_WEB_SHA" \
            https://api-staging.pirate.sc/__version "$EXPECTED_API_SHA"
      - name: Browser smoke staging
        timeout-minutes: 10
        working-directory: web
        env:
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_API_BASE_URL: https://api-staging.pirate.sc
        run: bun run test:e2e
      # ...and re-assert AFTER. If staging was redeployed mid-gate, these results
      # describe a build that is no longer there: fail rather than promote on
      # evidence gathered against someone else's SHA. The superseding run has its
      # own gate, so failing here loses no coverage.
      - name: Re-verify staging artifacts were not replaced mid-gate
        # Must run even when the smoke FAILED — that is precisely when the answer
        # matters. Without it a smoke failure is ambiguous: real product
        # regression, or another run redeploying staging mid-gate with the failure
        # an artifact of trampling. Scoped to !cancelled() plus a successful
        # pre-assertion rather than always(), so it stays quiet when setup or the
        # pre-assertion already failed and there is nothing meaningful to compare.
        if: ${{ !cancelled() && steps.require-staging-artifacts.outcome == 'success' }}
        working-directory: web
        env:
          EXPECTED_API_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          EXPECTED_WEB_SHA: ${{ github.sha }}
          # A MISMATCH here is terminal (staging was replaced) — fail immediately.
          # A transport failure is NOT: it says nothing about what is deployed, so
          # it must still retry. Setting ATTEMPTS=1 conflated the two and failed a
          # green run on one `fetch failed` (run 29937199404), blocking production.
          VERIFY_DEPLOYED_FAIL_FAST_ON_MISMATCH: "1"
        run: |
          node scripts/verify-deployed-versions.mjs \
            https://staging.pirate.sc/__version "$EXPECTED_WEB_SHA" \
            https://api-staging.pirate.sc/__version "$EXPECTED_API_SHA"
      - name: Fetch staging song preview container health secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: SONG_PREVIEW_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Verify staging song preview container health
        timeout-minutes: 5
        working-directory: web
        run: scripts/check-song-preview-container.sh staging
      - name: Upload release gate Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-gate-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14

  # Manual-only authenticated browser verification for the gate-tree rollout.
  # Keep it independent from the broad release smoke: an unrelated mocked UI
  # failure must not prevent this focused staging contract from running.
  gate-builder-staging-verification:
    name: Gate builder moderator round trip
    needs: [release-inputs]
    if: >-
      github.event_name == 'workflow_dispatch'
      && inputs.expected_staging_web_sha != ''
      && inputs.expected_staging_api_sha != ''
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ inputs.expected_staging_api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Require this run's staging artifacts
        working-directory: web
        env:
          EXPECTED_API_SHA: ${{ inputs.expected_staging_api_sha }}
          EXPECTED_WEB_SHA: ${{ inputs.expected_staging_web_sha }}
        run: |
          node scripts/verify-deployed-versions.mjs \
            https://staging.pirate.sc/__version "$EXPECTED_WEB_SHA" \
            https://api-staging.pirate.sc/__version "$EXPECTED_API_SHA"
      - name: Fetch staging moderator browser verification secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: 3141c3e2-a32c-4299-9382-c2684d11fe06
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: staging
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: AUTH_UPSTREAM_JWT_SHARED_SECRET
        run: scripts/ci/fetch-infisical-secrets.sh
      - name: Verify gate builder moderator save and reload
        timeout-minutes: 8
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: pirate-api-staging
          AUTH_UPSTREAM_JWT_ISSUER: pirate-staging-upstream
          E2E_API_BASE_URL: https://api-staging.pirate.sc
          E2E_BASE_URL: https://staging.pirate.sc
          E2E_LIVE_STAGING: "true"
          E2E_REQUIRED_RELEASE_GATE: "true"
        run: >-
          bun run test:e2e:required-gate --
          e2e/live-staging.live.spec.ts
          --project=live-staging
          --grep "round-trips a nested gate policy through the staging moderator UI"
      - name: Upload gate builder Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gate-builder-staging-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 14

  # The contract definitions and runner live in the API repository. This job
  # verifies the deployed SHA before testing, so an older staging Worker can
  # never satisfy a newer API release gate.
  api-staging-contract-gate:
    name: API staging contract gate
    needs: [release-inputs, staging]
    # Same reasoning as release-gate: a superseded run has nothing of its own
    # deployed to staging, so gating it against staging proves nothing.
    if: github.event_name != 'pull_request' && needs.staging.outputs.superseded != 'true'
    permissions:
      contents: read
      id-token: write
    # GitHub snapshots this reusable-workflow ref per run attempt. If the API
    # gate workflow changes, start a new push run; rerunning an older attempt
    # continues to use its previously resolved API workflow commit.
    uses: pirate-social-club/api/.github/workflows/staging-contract-gate.yml@main
    with:
      api_sha: ${{ needs.release-inputs.outputs.api_sha }}
      core_ref: ${{ needs.release-inputs.outputs.core_sha }}
      web_ref: ${{ github.sha }}
    secrets:
      AUTH_UPSTREAM_JWT_SHARED_SECRET: ${{ secrets.AUTH_UPSTREAM_JWT_SHARED_SECRET }}
      PIRATE_ADMIN_TOKEN: ${{ secrets.PIRATE_ADMIN_TOKEN }}

  # Guard against an older run overwriting a newer production deployment. Checked
  # as late as possible — after the blocking gate, immediately before deploying.
  production-freshness:
    name: Check release freshness
    needs: [api-staging-contract-gate, release-gate, schema-gate]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: read
      deployments: read
    outputs:
      stale: ${{ steps.check.outputs.stale }}
    steps:
      # See scripts/ci/production-freshness.cjs — the decision lives in a file
      # so it can be unit tested (scripts/ci/production-freshness.test.ts).
      # This job checks out the repo only to load that module; the authenticated
      # client still comes from actions/github-script.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Deploy only when no live successor will
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const productionFreshness = require(`${process.env.GITHUB_WORKSPACE}/scripts/ci/production-freshness.cjs`);
            await productionFreshness({ github, context, core });

  production:
    name: Deploy production
    needs: [api-staging-contract-gate, release-inputs, release-gate, schema-gate, production-freshness]
    # Manual production deploys remain default-off and can only deploy the
    # validated current main tip after the same freshness and staging gates.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)) && needs.production-freshness.outputs.stale == 'false'
    # The production deploy lane. This job applies migrations and deploys prod:
    # it must be exclusive, and it must NEVER be cancelled midway — an
    # interrupted migration is the one failure here that is not recoverable by
    # re-running. Staleness is handled by production-freshness above, which
    # rejects superseded runs before they reach this lock — but only when a live
    # successor is actually going to deploy, so that a burst of merges cannot
    # leave every run deferring to the next (#729).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: production
    permissions:
      actions: read
      contents: read
      deployments: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ needs.release-inputs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ needs.release-inputs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Verify Core checkout
        working-directory: web
        shell: bash
        env:
          CORE_RELEASE_SHA: ${{ needs.release-inputs.outputs.core_sha }}
        run: |
          source scripts/lib/release-source.sh
          require_clean_release_source "$GITHUB_WORKSPACE/core" "core" "$CORE_RELEASE_SHA"
          echo "Using pinned Core commit $CORE_RELEASE_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      # No dependency audit here. The staging job in THIS SAME RUN already audited
      # the identical web/api/core SHAs, and production cannot be reached without
      # it. Running the same audit twice doubled our exposure to a time-varying
      # external input for no additional signal.
      - name: Install shared dependencies
        working-directory: api/services/shared
        run: bun install --frozen-lockfile
      - name: Install API dependencies
        working-directory: api/services/api
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: bun install --frozen-lockfile
      - name: Install community shard dependencies
        working-directory: api/services/community-d1-shard
        run: bun install --frozen-lockfile
      - name: Install core dependencies
        working-directory: core
        run: npm ci
      # Fresh check of the LIVE PRODUCTION fleet, immediately before migrations and
      # deploy. The staging schema-gate is a promotion gate; this is the real one —
      # the allocated prod fleet can change between then and now, so we re-attest it
      # here rather than trust the earlier pass. Read-only. If any live prod shard
      # is missing a required migration, we STOP before mutating or deploying.
      - name: Verify production fleet satisfies pinned API schema requirements
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # D1 read across the fleet — the isolated D1 token, not the Worker-deploy
          # token (D1 access is deliberately kept off the deploy token).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
        run: |
          bun core/scripts/community/verify-community-schema-requirements.ts \
            --prod \
            --requirements api/services/api/community-schema-requirements.json \
            --wrangler-config api/services/community-d1-shard/wrangler.jsonc \
            --migrations-dir core/db/community-template/migrations \
            --drift-policy core/db/known-community-migration-drifts.json \
            --canonical-baseline api/services/api/docs/attestations/community-schema/production-canonical-baseline.json \
            --manifest "$GITHUB_WORKSPACE/schema-gate-production.json" \
            --concurrency 14
      - name: Upload production schema manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: schema-gate-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: schema-gate-production.json
          if-no-files-found: warn
          retention-days: 14
      - name: Require dedicated Web production migration identity
        shell: bash
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID }}
        run: |
          if [[ -z "$INFISICAL_IDENTITY_ID" ]]; then
            echo "::error::Set repository variable INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID to the doctor-verified github-web-prod-migration identity ID."
            exit 1
          fi
      - name: Fetch production control-plane migration secret
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/control-plane
          SECRET_NAMES: CONTROL_PLANE_MIGRATOR_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh
      # IN-LANE freshness, mirroring the staging lane. production-freshness runs
      # before this job acquires the production-deploy lock, and nothing orders
      # lock acquisition against that check — so between the two, main can
      # advance and another run can finish deploying. Re-check with the lock
      # held, immediately before the first mutation. Everything below that
      # mutates production is gated on this result, not the earlier job.
      - name: Re-check freshness inside the production lane
        id: in-lane-freshness-prod
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const productionFreshness = require(`${process.env.GITHUB_WORKSPACE}/web/scripts/ci/production-freshness.cjs`);
            await productionFreshness({ github, context, core });
      # Fail before the first production mutation when the community shard
      # Worker cannot serve the API commit this release is about to deploy.
      # The pinned checkout is the authority; the live API's expected version
      # is diagnostic only because it describes the currently deployed pair.
      - name: Verify production community shard transition is safe
        id: shard-preflight
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: web
        run: |
          node scripts/verify-community-shard-compatibility.mjs \
            --api-dir "$GITHUB_WORKSPACE/api" \
            --phase pre-deploy \
            --health-url https://api.pirate.sc/health/provisioning
      - name: Deploy pinned production community shard first
        if: steps.in-lane-freshness-prod.outputs.stale == 'false' && steps.shard-preflight.outputs.deploy_shard == 'true'
        working-directory: api/services/community-d1-shard
        env:
          BUILD_GIT_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          BUILD_GIT_REF: pinned/${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy -- --env production
      - name: Verify bounded shard-first transition
        if: steps.in-lane-freshness-prod.outputs.stale == 'false' && steps.shard-preflight.outputs.deploy_shard == 'true'
        working-directory: web
        run: |
          node scripts/verify-community-shard-compatibility.mjs \
            --api-dir "$GITHUB_WORKSPACE/api" \
            --phase transition \
            --previous-source-version "${{ steps.shard-preflight.outputs.previous_source_version }}" \
            --health-url https://api.pirate.sc/health/provisioning
      - name: Apply production control-plane migrations
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/control-plane/migrations \
            --label control-plane
      - name: Apply production bookings migrations
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: core
        run: |
          test -n "${CONTROL_PLANE_MIGRATOR_DATABASE_URL:-}"
          export CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_MIGRATOR_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun scripts/control-plane/apply-postgres-migrations.ts \
            --database-url-env CONTROL_PLANE_MIGRATOR_DATABASE_URL_BUN \
            --migrations db/bookings/migrations \
            --label bookings
      - name: Deploy production
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: web
        env:
          API_RELEASE_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_BASE_NETWORK: ${{ vars.VITE_BASE_NETWORK }}
          VITE_EFP_ENVIRONMENT: ${{ vars.VITE_EFP_ENVIRONMENT }}
          VITE_GATE_TREE_BUILDER_ENABLED: "true"
          VITE_PIRATE_APP_ENV: ${{ vars.VITE_PIRATE_APP_ENV || 'prod' }}
          VITE_ASYNC_SONG_PUBLISH_ENABLED: ${{ vars.VITE_ASYNC_SONG_PUBLISH_ENABLED || 'false' }}
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ vars.VITE_PRIVY_CLIENT_ID }}
          VITE_REWARDS_ENABLED: "true"
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: scripts/deploy-production.sh --confirm-production --skip-tests
      - name: Verify production release metadata
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: web
        env:
          EXPECTED_API_SHA: ${{ needs.release-inputs.outputs.api_sha }}
          EXPECTED_WEB_SHA: ${{ github.sha }}
        run: |
          node scripts/verify-deployed-versions.mjs \
            https://pirate.sc/__version "$EXPECTED_WEB_SHA" \
            https://api.pirate.sc/__version "$EXPECTED_API_SHA"
      - name: Require exact community shard convergence
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: web
        run: |
          node scripts/verify-community-shard-compatibility.mjs \
            --api-dir "$GITHUB_WORKSPACE/api" \
            --phase converged \
            --health-url https://api.pirate.sc/health/provisioning
      - name: Verify production multipart storage
        if: steps.in-lane-freshness-prod.outputs.stale == 'false'
        working-directory: web
        env:
          AUTH_UPSTREAM_JWT_AUDIENCE: ${{ vars.PRODUCTION_MULTIPART_CANARY_AUTH_AUDIENCE }}
          AUTH_UPSTREAM_JWT_ISSUER: ${{ vars.PRODUCTION_MULTIPART_CANARY_AUTH_ISSUER }}
          AUTH_UPSTREAM_JWT_SHARED_SECRET: ${{ secrets.PRODUCTION_MULTIPART_CANARY_AUTH_SECRET }}
          PIRATE_MULTIPART_CANARY_API_BASE_URL: https://api.pirate.sc
          PIRATE_MULTIPART_CANARY_COMMUNITY_ID: ${{ vars.PRODUCTION_MULTIPART_CANARY_COMMUNITY_ID }}
          PIRATE_MULTIPART_CANARY_CONFIRM_PRODUCTION: RUN_PRODUCTION_MULTIPART_CANARY
          PIRATE_MULTIPART_CANARY_SUBJECT: ${{ vars.PRODUCTION_MULTIPART_CANARY_SUBJECT }}
        run: bun scripts/live-production-multipart-canary.ts
