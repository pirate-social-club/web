name: Staging posts idempotency column repair

on:
  workflow_dispatch:
    inputs:
      mode:
        description: audit or repair
        required: true
        default: audit
        type: choice
        options: [audit, repair]
      only:
        description: Optional comma-separated staging database names
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: staging-posts-idempotency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 120
    environment: staging
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { path: web }
      - name: Resolve pinned refs
        id: refs
        working-directory: web
        run: |
          echo "api_sha=$(<.github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"
          echo "core_sha=1d136400eaa110e0a9cb6200f9f33d7b9948f865" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          ref: ${{ steps.refs.outputs.api_sha }}
          path: api
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ steps.refs.outputs.core_sha }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Validate confirmation
        env:
          MODE: ${{ inputs.mode }}
        run: test "$MODE" = audit || test "$MODE" = repair
      - name: Apply measured additive repair
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          MODE: ${{ inputs.mode }}
          ONLY: ${{ inputs.only }}
        run: |
          mkdir -p repair-output
          args=( \
            --wrangler-config api/services/community-d1-shard/wrangler.jsonc \
            --migrations-dir core/db/community-template/migrations \
            --manifest repair-output/manifest.json )
          [[ -n "$ONLY" ]] && args+=(--only "$ONLY")
          if [[ "$MODE" == repair ]]; then args+=(--execute --confirm-time-travel); fi
          bun core/scripts/community/repair-staging-1158-source-columns.ts "${args[@]}"
      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-posts-idempotency-repair-${{ github.run_id }}
          path: repair-output
          if-no-files-found: warn
          retention-days: 30
