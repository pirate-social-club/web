name: web-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Required application-source gate. Test and Storybook projects have separate
  # tsconfigs and are not covered by this job.
  typecheck:
    name: typecheck
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Read pinned API commit
        id: api-pin
        shell: bash
        # Web ships with this exact API contract. Using API main here would let
        # web compile against contract changes that production does not serve yet.
        run: echo "sha=$(tr -d '[:space:]' < .github/release-refs/api.sha)" >> "$GITHUB_OUTPUT"

      - name: Check out pinned API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api
          ref: ${{ steps.api-pin.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Typecheck web
        run: bun run types

  unit-tests:
    name: unit-tests (${{ matrix.shard }}/4)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Check out API workspace dependencies
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/api
          path: api

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install API workspace dependency dependencies
        working-directory: api/services/efp-shared
        run: bun install --frozen-lockfile

      - name: Generate karaoke runtime build provenance
        working-directory: web/packages/karaoke-runtime
        run: bun run build:provenance

      - name: Run unit and component tests
        shell: bash
        env:
          TEST_SHARD: ${{ matrix.shard }}
          TEST_SHARD_COUNT: 4
        run: |
          set -uo pipefail

          # `scripts` is included deliberately: scripts/ci/dependency-audit.test.ts
          # existed for weeks without ever running, because discovery stopped at
          # src and packages. A test that never runs is worse than no test — it
          # reads as coverage.
          mapfile -t test_files < <(
            find src packages scripts -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              -print | sort
          )

          failures=0
          selected=0
          for index in "${!test_files[@]}"; do
            if (( index % TEST_SHARD_COUNT != TEST_SHARD - 1 )); then
              continue
            fi

            test_file="${test_files[$index]}"
            selected=$((selected + 1))
            echo "::group::${test_file}"
            if ! bun test "${test_file}" --timeout=15000; then
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done

          echo "Shard ${TEST_SHARD}/${TEST_SHARD_COUNT}: ${selected} files, ${failures} failed"
          if (( failures > 0 )); then
            exit 1
          fi

  promotion-shadow-store:
    name: promotion-shadow-store
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web

      - name: Check out canonical promotion schema
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: 508477aeed2157f4f6c9dbc34c6ddf1ad189169f
          path: core

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.10

      - name: Run promotion shadow store integration test
        working-directory: web
        env:
          PROMOTION_STORE_TEST_ADMIN_URL: "postgres://postgres:postgres@127.0.0.1:5432/postgres?sslmode=disable"
          PROMOTION_STORE_TEST_CORE_DIR: ${{ github.workspace }}/core
        run: bun test scripts/ci/promotion-model/postgres-store.test.ts
