name: Solid isolated staging

on:
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: Deploy the isolated Solid staging pair after the build gates
        required: true
        default: false
        type: boolean
      solid_staging_origin:
        description: Origin of the isolated Solid staging Worker for smoke probes
        required: false
        default: ""
        type: string
      public_staging_origin:
        description: Origin of the isolated Solid PUBLIC staging Worker for probes
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: solid-isolated-staging
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-verify:
    name: Build and verify Solid
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out Web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install Solid dependencies
        run: |
          bun install --cwd solid --frozen-lockfile
          bun install --cwd packages/solid-ui --frozen-lockfile
      - name: Run the full Solid test suite
        run: |
          bun run --cwd solid typecheck
          bun test --cwd solid src
          bun test packages/web-platform/src packages/route-contracts/src
      - name: Build the staging environment
        env:
          CLOUDFLARE_ENV: staging
        run: bun run --cwd solid build -- --mode staging
      - name: Require the isolated auxiliary and entry manifests
        run: |
          test -f solid/dist/pirate_web_solid_public/wrangler.json
          test -f solid/dist/ssr/wrangler.json

  deploy-and-smoke:
    name: Deploy and smoke isolated Solid staging
    needs: build-and-verify
    if: inputs.deploy_staging
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: solid-staging
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out Web
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          path: web
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - name: Install Solid dependencies
        run: |
          bun install --cwd solid --frozen-lockfile
          bun install --cwd packages/solid-ui --frozen-lockfile
      - name: Build the exact staging artifact
        env:
          CLOUDFLARE_ENV: staging
        run: bun run --cwd solid build -- --mode staging
      - name: Require explicit isolated probe origins
        env:
          SOLID_ORIGIN: ${{ inputs.solid_staging_origin }}
          PUBLIC_ORIGIN: ${{ inputs.public_staging_origin }}
        run: |
          test -n "$SOLID_ORIGIN"
          test -n "$PUBLIC_ORIGIN"
      - name: Deploy Solid PUBLIC staging Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          bunx wrangler@4.123.0 deploy
          --config solid/dist/pirate_web_solid_public/wrangler.json
          --env staging
          --var SOLID_BUILD_SHA:${{ github.sha }}
          --var SOLID_BUILD_REF:${{ github.ref }}
      - name: Deploy Solid entry staging Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SOLID_ORIGIN: ${{ inputs.solid_staging_origin }}
        run: >-
          SOLID_STAGING_HOST="$(node -e 'process.stdout.write(new URL(process.argv[1]).hostname)' "$SOLID_ORIGIN")" &&
          bunx wrangler@4.123.0 deploy
          --config solid/dist/ssr/wrangler.json
          --env staging
          --var SOLID_STAGING_HOST:$SOLID_STAGING_HOST
          --var SOLID_BUILD_SHA:${{ github.sha }}
          --var SOLID_BUILD_REF:${{ github.ref }}
      - name: Probe versions and smoke gates
        env:
          SOLID_ORIGIN: ${{ inputs.solid_staging_origin }}
          PUBLIC_ORIGIN: ${{ inputs.public_staging_origin }}
        run: node solid/scripts/staging-smoke.mjs "$SOLID_ORIGIN" "$PUBLIC_ORIGIN" "${{ github.sha }}"
