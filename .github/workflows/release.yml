name: Production Web Hotfix

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Deploy production web
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        run: bun install --frozen-lockfile
      - name: Build production web bundle
        env:
          VITE_BASE_NETWORK: ${{ vars.VITE_BASE_NETWORK }}
          VITE_EFP_ENVIRONMENT: ${{ vars.VITE_EFP_ENVIRONMENT }}
          VITE_PIRATE_APP_ENV: ${{ vars.VITE_PIRATE_APP_ENV || 'prod' }}
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_PRIVY_CLIENT_ID: ${{ vars.VITE_PRIVY_CLIENT_ID }}
        run: bun run build:prod
      - name: Deploy production web workers
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          WEB_SHA="$(git rev-parse --short HEAD)-web-hotfix"
          WEB_REF="$(git rev-parse --abbrev-ref HEAD)"
          BUILD_TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ./node_modules/.bin/wrangler deploy dist/worker/index.js \
            --config wrangler.jsonc \
            --assets dist/client \
            --no-bundle \
            --var "DEPLOY_ENV:production" \
            --var "BUILD_GIT_SHA:$WEB_SHA" \
            --var "BUILD_GIT_REF:$WEB_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
          ./node_modules/.bin/wrangler deploy \
            --config wrangler.public.jsonc \
            --var "DEPLOY_ENV:production" \
            --var "BUILD_GIT_SHA:$WEB_SHA" \
            --var "BUILD_GIT_REF:$WEB_REF" \
            --var "BUILD_TIMESTAMP:$BUILD_TIMESTAMP"
      - name: Verify production web metadata
        run: |
          WEB_SHA="$(git rev-parse --short HEAD)-web-hotfix"
          scripts/check-deployments.sh --scope prod --expected-web-sha "$WEB_SHA" --retry-for 60 --no-strict
