name: Provider identity invalid-link audit

on:
  workflow_dispatch:
    inputs:
      decision_ref:
        description: Reviewed reference for this read-only audit
        required: true
        type: string

concurrency:
  group: provider-identity-invalid-link-audit-production
  cancel-in-progress: false

jobs:
  audit:
    name: Audit accepted evidence links (read-only)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      CORE_SHA: 4f6e68ed0ee5ff0ef33b39b2d3c4f055d704c9b9
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: pirate-social-club/core
          ref: ${{ env.CORE_SHA }}
          path: core
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6

      - name: Validate reviewed input and Web identity
        shell: bash
        env:
          DECISION_REF: ${{ inputs.decision_ref }}
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID }}
        run: |
          set -euo pipefail
          [[ "$DECISION_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._:/-]{2,159}$ ]]
          [[ "$INFISICAL_IDENTITY_ID" =~ ^[0-9a-fA-F-]{36}$ ]]

      - name: Fetch production control-plane credential through Web OIDC
        working-directory: core
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_WEB_PROD_MIGRATION_IDENTITY_ID }}
          INFISICAL_PROJECT_ID: 5acea78e-7813-4d8a-b29c-9b862a0b1c71
          INFISICAL_ENV: prod
          INFISICAL_SECRET_PATH: /services/api
          SECRET_NAMES: CONTROL_PLANE_DATABASE_URL
        run: scripts/ci/fetch-infisical-secrets.sh

      - name: Run aggregate invalid-link audit
        working-directory: core
        env:
          DECISION_REF: ${{ inputs.decision_ref }}
        shell: bash
        run: |
          set -euo pipefail
          export CONTROL_PLANE_DATABASE_URL_BUN="$(node -e "const raw=process.env.CONTROL_PLANE_DATABASE_URL;if(!raw)process.exit(2);const url=new URL(raw);url.searchParams.delete('sslrootcert');process.stdout.write(url.toString())")"
          bun -e '
            import { sanitizePostgresUrlForBunSql } from "./scripts/lib/postgres-url.ts";
            const db = new Bun.SQL(sanitizePostgresUrlForBunSql(process.env.CONTROL_PLANE_DATABASE_URL_BUN));
            try {
              await db.begin(async (tx) => {
                await tx`SET TRANSACTION READ ONLY`;
                const rows = await tx`
                  WITH candidates AS (
                    SELECT a.provider, a.capability_key, a.status,
                      CASE
                        WHEN a.source_identity_nullifier_id IS NULL THEN \'unbound\'
                        WHEN n.identity_nullifier_id IS NULL THEN \'dangling\'
                        WHEN n.status <> \'active\' THEN \'inactive_nullifier\'
                        WHEN n.user_id <> a.user_id OR n.provider <> a.provider THEN \'ownership_or_provider_mismatch\'
                        ELSE \'valid\'
                      END AS link_state
                    FROM user_attestations a
                    LEFT JOIN identity_nullifiers n ON n.identity_nullifier_id = a.source_identity_nullifier_id
                    WHERE a.status = \'accepted\'
                      AND a.capability_key IN (\'unique_human\', \'minimum_age\', \'age_over_18\', \'nationality\', \'gender\')
                  )
                  SELECT provider, capability_key, status, link_state, COUNT(*)::integer AS rows
                  FROM candidates
                  GROUP BY provider, capability_key, status, link_state
                  ORDER BY provider, capability_key, status, link_state
                `;
                console.log(JSON.stringify({ decision_ref: process.env.DECISION_REF, rows }, null, 2));
              });
            } finally { await db.end(); }
          '
